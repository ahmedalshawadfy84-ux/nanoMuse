name: Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Upload Fast-Vision nanoMuse APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository (with Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.25 (Required for rclone.aar)
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Fast-Vision Architecture (hands-fast-vision.md)
        run: |
          HANDS_MAIN="android/src/android/app/src/main/java/io/github/nanomuse/hands"
          HANDS_TEST="android/src/android/app/src/test/java/io/github/nanomuse/hands"
          mkdir -p "$HANDS_MAIN" "$HANDS_TEST" nanomuse

          for search_dir in "." "nanoMuse-modified-files" "modified"; do
            if [ -d "$search_dir" ]; then
              [ -f "$search_dir/config.py" ] && cp -f "$search_dir/config.py" nanomuse/config.py
            fi
          done

          cat << 'EOF_HANDS_KT' > "$HANDS_MAIN/Hands.kt"
          package io.github.nanomuse.hands

          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Build
          import android.provider.Settings
          import com.openminis.app.MinisApp
          import com.openminis.app.accessibility.MinisAccessibilityService
          import com.openminis.app.data.model.ModelEntry
          import com.openminis.app.data.model.ProviderInstance
          import com.openminis.app.data.model.hasImageInput
          import com.openminis.app.data.repository.ProviderRepository
          import io.github.nanomuse.cloud.NanoMuseCloud
          import kotlinx.coroutines.channels.awaitClose
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.callbackFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          /**
           * The screen as a hand (0.1.12). Off by default; when the user switches it on and the three
           * prerequisites hold, the agent gets `nanomuse-hands` — a screenshot-driven operator that taps,
           * types and swipes in the apps that have no API — as the last rung of the ladder.
           *
           * The eyes are the screenshot alone: no accessibility tree is read for perception. The
           * accessibility service is the hand (gestures, the screenshot itself, the focused field to
           * type into) and nothing more.
           */
          object Hands {
              private const val PREFS = "nanomuse"
              private const val KEY_ENABLED = "hands.enabled"
              private const val KEY_MODEL = "hands.model_entry"
              const val DEEP_LINK = "minis://settings/hands"
              const val MIN_SDK = Build.VERSION_CODES.R

              private fun prefs(context: Context): SharedPreferences = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun enabled(context: Context): Boolean = prefs(context).getBoolean(KEY_ENABLED, false)
              fun setEnabled(context: Context, on: Boolean) { prefs(context).edit().putBoolean(KEY_ENABLED, on).apply() }

              /** The switch as a flow: the current value, then every change, wherever it is made. */
              fun enabledFlow(context: Context): Flow<Boolean> = callbackFlow {
                  val p = prefs(context.applicationContext)
                  val listener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                      if (key == KEY_ENABLED) trySend(p.getBoolean(KEY_ENABLED, false))
                  }
                  p.registerOnSharedPreferenceChangeListener(listener)
                  trySend(p.getBoolean(KEY_ENABLED, false))
                  awaitClose { p.unregisterOnSharedPreferenceChangeListener(listener) }
              }

              /** The chosen screen model's entry id; null means "pick one" ([screenModel]). */
              fun modelEntryId(context: Context): String? = prefs(context).getString(KEY_MODEL, null)?.takeIf { it.isNotBlank() }
              /** Null forgets the choice: the screen's model follows the automatic order again. */
              fun setModelEntryId(context: Context, id: String?) {
                  prefs(context).edit().apply { if (id == null) remove(KEY_MODEL) else putString(KEY_MODEL, id) }.apply()
              }

              // ── readiness ──────────────────────────────────────────────────────────

              data class Readiness(
                  val androidOk: Boolean,
                  val serviceOn: Boolean,
                  val overlayOk: Boolean,
                  val model: ScreenModel?,
              ) {
                  val ready: Boolean get() = androidOk && serviceOn && overlayOk && model != null
              }

              fun readiness(context: Context): Readiness = Readiness(
                  androidOk = Build.VERSION.SDK_INT >= MIN_SDK,
                  serviceOn = MinisAccessibilityService.getInstance() != null,
                  overlayOk = Settings.canDrawOverlays(context),
                  model = screenModel(context),
              )

              /** Usable right now: switched on and every prerequisite in place. */
              fun usable(context: Context): Boolean = enabled(context) && readiness(context).ready

              // ── the screen model ───────────────────────────────────────────────────

              /** How the screen model was arrived at, for the settings page to say. */
              enum class Why { CHOSEN, CHAT_PROVIDER, MENU, DEFAULT, CHAT, GROUP, VISION_GROUP, ANY }

              /**
               * The own-key fallback for the hands (contract C4): `qwen3.8-27b` on 阿里云百炼,
               * `qwen/qwen3.8-27b` on OpenRouter. Cloud names and recommends its screen model in the
               * menu instead. The chat model is a separate setting.
               */
              val DEFAULT_MODEL_IDS = listOf("qwen3.8-27b", "qwen/qwen3.8-27b")

              /** A model that sees pictures, with the key to call it. */
              data class ScreenModel(val instance: ProviderInstance, val entry: ModelEntry, val apiKey: String, val why: Why = Why.ANY) {
                  val label: String get() = entry.model.displayName.ifBlank { entry.model.id } + " · " + instance.label.ifBlank { instance.providerType.name }
                  val modelId: String get() = entry.model.id
              }

              /**
               * Every enabled model that declares image input, for the picker — of providers whose
               * vendor has vision models (contract C11, [io.github.nanomuse.cloud.Capabilities]; a
               * provider the catalogue does not know is taken at its models' word).
               */
              fun visionEntries(context: Context): List<Pair<ProviderInstance, ModelEntry>> {
                  val repo = repo(context) ?: return emptyList()
                  val cfg = repo.config.value
                  return cfg.modelEntries.filter { !it.isHidden && it.model.hasImageInput }.mapNotNull { e ->
                      cfg.instances.firstOrNull { it.id == e.providerInstanceId && it.isEnabled && sees(context, it) }?.let { it to e }
                  }
              }

              /** The vendor of [inst] has models that see (C11); true for an endpoint the catalogue does not know. */
              fun sees(context: Context, inst: ProviderInstance): Boolean =
                  io.github.nanomuse.cloud.Capabilities.allows(context, inst, io.github.nanomuse.cloud.ProviderCatalogue.VISION)

              /** No configured provider has a model that sees the screen: the one sentence that says so (C11), or null when one has. */
              fun unavailableLine(context: Context): String? =
                  if (visionEntries(context).isEmpty()) io.github.nanomuse.cloud.Capabilities.unavailableLine(context, io.github.nanomuse.cloud.ProviderCatalogue.VISION) else null

              /**
               * The model that looks at the screen — the *hands model*, a setting of its own beside the
               * chat model (contract C4) — in the order of the Models page (0.1.41, [io.github.nanomuse.models.SlotOrder]):
               * the one chosen in Settings → Models (or → Hands); the chat provider's own model for the
               * screen (the catalogue's `defaults.hands`, else its first model that sees) when the chat
               * provider is the person's own and sees — the relay never jumps ahead of a provider the
               * person chose; nanoMuse Cloud's model for the screen (what the relay recommends
               * `for: gui`), when signed in; the own-key default (`qwen3.8-27b`
               * on 百炼, `qwen/qwen3.8-27b` on OpenRouter); then, for a set-up with none of those, the
               * chat model the person last picked when it sees, the first sighted member of the default
               * group, the Vision Group, and last any enabled vision model, preferring names that say so
               * (`vl`, `vision`) — but never one of the Cloud's catalog models the person did not pick,
               * so a member is not quietly billed for `qwen-vl-max` because its name has `vl` in it.
               * Null when none of the user's models sees. [automatic] leaves the choice aside and answers
               * what the rest of the order gives now, for the picker's *Automatic* row.
               */
              fun screenModel(context: Context, automatic: Boolean = false): ScreenModel? {
                  val repo = repo(context) ?: return null
                  val cfg = repo.config.value
                  fun usable(inst: ProviderInstance?, entry: ModelEntry?, why: Why): ScreenModel? {
                      if (inst == null || entry == null || !inst.isEnabled || !entry.model.hasImageInput || !sees(context, inst)) return null
                      val key = repo.usableApiKey(inst) ?: return null
                      return ScreenModel(inst, entry, key, why)
                  }
                  fun byEntry(entry: ModelEntry?, why: Why): ScreenModel? =
                      entry?.let { e -> usable(cfg.instances.firstOrNull { it.id == e.providerInstanceId }, e, why) }
                  if (!automatic) modelEntryId(context)?.let { id -> byEntry(cfg.modelEntries.firstOrNull { it.id == id }, Why.CHOSEN) }?.let { return it }
                  val cloud = NanoMuseCloud.instance(context)
                  // the chat provider's own model for the screen, when the chat provider is the
                  // person's own and sees: `defaults.hands` of the catalogue, else its first that sees
                  io.github.nanomuse.models.ModelSlots.ownChatInstance(context)?.takeIf { sees(context, it) }?.let { own ->
                      val wanted = io.github.nanomuse.models.ModelSlots.defaultOf(context, own, io.github.nanomuse.models.ModelSlots.Slot.HANDS)
                      val sighted = cfg.modelEntries.filter { it.providerInstanceId == own.id && !it.isHidden && it.model.hasImageInput }
                      (sighted.firstOrNull { wanted != null && it.model.id.equals(wanted, ignoreCase = true) } ?: sighted.firstOrNull())
                          ?.let { byEntry(it, Why.CHAT_PROVIDER) }
                  }?.let { return it }
                  if (cloud != null) {
                      NanoMuseCloud.sightedModelId(context)?.let { sighted ->
                          byEntry(cfg.modelEntries.firstOrNull { it.providerInstanceId == cloud.id && it.model.id == sighted && !it.isHidden }, Why.MENU)
                      }?.let { return it }
                  }
                  // the hands' default under a key of the person's own (Bailian, OpenRouter, a relay of
                  // their own): the entry has to be there already — nothing is added behind their back
                  DEFAULT_MODEL_IDS.firstNotNullOfOrNull { wanted ->
                      cfg.modelEntries.filter { !it.isHidden && it.model.id.equals(wanted, ignoreCase = true) }
                          .firstNotNullOfOrNull { byEntry(it, Why.DEFAULT) }
                  }?.let { return it }
                  byEntry(repo.lastUsedVisibleEntry(), Why.CHAT)?.let { return it }
                  val defaultGroup = cfg.modelGroups.firstOrNull { it.id == cfg.defaultPrimaryGroupId } ?: cfg.modelGroups.firstOrNull()
                  defaultGroup?.memberEntryIds?.firstNotNullOfOrNull { id ->
                      byEntry(cfg.modelEntries.firstOrNull { it.id == id }, Why.GROUP)
                  }?.let { return it }
                  repo.resolveVisionCandidates().firstNotNullOfOrNull { (inst, e) -> usable(inst, e, Why.VISION_GROUP) }?.let { return it }
                  val all = visionEntries(context)
                      .filter { (inst, e) -> inst.id != cloud?.id || !NanoMuseCloud.isCatalogModel(context, e.model.id) }
                      .mapNotNull { (inst, e) -> usable(inst, e, Why.ANY) }
                  return all.firstOrNull { Regex("vl|vision", RegexOption.IGNORE_CASE).containsMatchIn(it.modelId) } ?: all.firstOrNull()
              }

              private fun repo(context: Context): ProviderRepository? = (context.applicationContext as? MinisApp)?.providerRepositoryOrNull

              // ── a run in progress ──────────────────────────────────────────────────

              /** True while the hands are working; the settings page and the overlay observer read it. */
              private val _active = MutableStateFlow(false)
              val active: StateFlow<Boolean> = _active.asStateFlow()
              internal fun setActive(on: Boolean) { _active.value = on }

              /**
               * Takes the hands for a run: true when they were free, false when another run holds them.
               * One atomic step, so two `nanomuse-hands run` arriving together cannot both start; the
               * run that gets them hands them back in [HandsOperator.run]'s finish.
               */
              internal fun claim(): Boolean = _active.compareAndSet(expect = false, update = true)

              /** The run in progress, so Stop can reach it from anywhere. */
              @Volatile internal var current: HandsOperator? = null
              /** Sticky session resume note if a previous run hit timeout or step cap (`hands-fast-vision.md`). */
              @Volatile var lastResumeNote: String? = null

              /** Ends the run in progress after the action in flight; a no-op when none. */
              fun stopCurrent(reason: String = "stopped from the app") { current?.requestStop(reason) }

              // ── what the agent is told ─────────────────────────────────────────────

              /**
               * The system-prompt paragraph: the ladder, and the CLI when the hands are usable. English,
               * like the rest of the prompt; honest about what is off so the agent explains and links the
               * setting instead of pretending to tap.
               */
              fun promptParagraph(context: Context): String {
                  val on = enabled(context)
                  val r = readiness(context)
                  return buildString {
                      append("## Apps without an API — the ladder (nanoMuse)\n")
                      append("Most everyday apps here (12306, 微信, 支付宝, 美团, 淘宝, 京东…) have no API. Climb in this order and say which rung you are on before you start: ")
                      append("(1) a skill, a CLI or an MCP server; (2) the page fetched with the user's login or `browser_use`; (3) the phone's own screen, last. ")
                      append("A task is rarely all screen: find the number with a command, the button with the screen, and ask before it is pressed.\n")
                      if (on && r.ready) {
                          append("The screen is available: `nanomuse-hands run --task \"<one clear task, with every detail the hands need>\" [--app \"<app name>\"]` ")
                          append("(screen model: ${r.model?.label}). It looks at screenshots — never the accessibility tree — and taps, types and swipes; a capsule with Stop shows the user what it does. ")
                          append("It never types passwords, codes or card numbers: for a login or a code it hands the phone to the user and waits. Taps that pay, send, post or delete go through the same approval card as the shell and the browser. ")
                          append("It returns JSON: `outcome` is done (with `answer`), stopped (the user tapped Stop — do not restart it), needs_user (`question` — relay it and wait), infeasible or failed (with `message`); `last_screen` is a picture you can show with `![screen](<last_screen>)`. ")
                          append("Tell the user in one line that you are about to use the screen and which app, then run it; give one task per run, and never a payment as the task. `nanomuse-hands apps` lists the installed apps; `nanomuse-hands status` says what is set up.")
                      } else if (on) {
                          val missing = buildList {
                              if (!r.androidOk) add("Android 11 or newer")
                              if (!r.serviceOn) add("the accessibility service is off")
                              if (!r.overlayOk) add("no permission to draw over other apps")
                              if (r.model == null) add("no model that can see pictures")
                          }.joinToString(", ")
                          append("The screen is switched on but not usable yet ($missing). If a task needs it, say so in one line and give the link [Hands]($DEEP_LINK) — it opens the setting; do not try android-a11y-cli instead.")
                      } else {
                          append("Operating the phone's screen is switched off (the default). If a task can only be done on the screen, say so in one line and give the link [Hands]($DEEP_LINK) so the user can switch it on; do not try android-a11y-cli instead, and do not pretend.")
                      }
                  }
              }
          }
          EOF_HANDS_KT

          cat << 'EOF_SCREEN_WORDS' > "$HANDS_MAIN/ScreenWords.kt"
          package io.github.nanomuse.hands

          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityNodeInfo
          import com.openminis.app.accessibility.MinisAccessibilityService
          import org.json.JSONArray
          import org.json.JSONObject
          import kotlin.math.abs
          import kotlin.math.hypot

          /**
           * Implements the `hands-fast-vision.md` Touch Contract & Local Fast Eye:
           * 1. Never replaces an explicit coordinate with a distant text search (prevents `Level 6`
           *    at [500, 768] -> (540, 1843) from ever jumping to the Coin `+` button at (551, 208)).
           * 2. Assigns stable IDs (`green_btn`, `c1..cN` for game objects, `u1..uN` for UI nodes)
           *    with exact bounding boxes and live centers in <35ms.
           * 3. Vetoes accidental taps on forbidden HUD danger zones (Coin `+` bar, Shop tab) when
           *    the target is a game piece or Level/Continue button.
           */
          object ScreenWords {
              private const val MAX_UP = 3

              data class TrackedObject(
                  val id: String,
                  val kind: String,
                  val label: String,
                  val rawText: String = "",
                  val rawDesc: String = "",
                  val colorName: String,
                  val gx: Int,
                  val gy: Int,
                  val tapX: Int,
                  val tapY: Int,
                  val boxPx: Rect,
                  val boxGrid: IntArray, // [gx1, gy1, gx2, gy2]
                  val freeOrEyes: Boolean,
                  val clickable: Boolean,
              ) {
                  fun matchesTarget(q: String): Boolean {
                      val t = q.trim()
                      if (t.isEmpty()) return false
                      return label.equals(t, ignoreCase = true) ||
                          rawText.equals(t, ignoreCase = true) ||
                          rawDesc.equals(t, ignoreCase = true)
                  }
              }

              data class LocalSceneState(
                  val objects: List<TrackedObject>,
                  val byId: Map<String, TrackedObject>,
                  val isGameCanvas: Boolean,
                  val isLoadingOverlay: Boolean,
                  val promptSummary: String,
              )

              data class ResolvedTap(
                  val px: Int,
                  val py: Int,
                  val boxPx: Rect?,
                  val vetoReason: String? = null,
                  val underFingerDesc: String = "",
                  val resolvedFrom: String = "coord",
              )

              fun at(svc: MinisAccessibilityService, x: Int, y: Int): String? {
                  val words = LinkedHashSet<String>()
                  try {
                      for (root in svc.rootNodes()) {
                          val leaf = deepestAt(root, x, y, 0) ?: continue
                          var node: AccessibilityNodeInfo? = leaf
                          var up = 0
                          while (node != null && up <= MAX_UP) {
                              label(node)?.let { words.add(it) }
                              if (node.isClickable && up > 0) break
                              node = node.parent
                              up++
                          }
                          if (words.isNotEmpty()) break
                      }
                  } catch (_: Throwable) {
                      // a tree that changed under us is no reason to fail the tap; the model's label stands
                  }
                  return words.joinToString(" ").trim().take(200).ifBlank { null }
              }

              /**
               * Builds the complete local scene state (UI tree + fast bitmap object tracker) in <35ms.
               */
              fun analyzeScene(
                  svc: MinisAccessibilityService,
                  bmp: Bitmap,
                  screenW: Int,
                  screenH: Int,
              ): LocalSceneState {
                  val uiList = collectUiElements(svc, screenW, screenH)
                  val loading = uiList.any {
                      val l = it.label.lowercase()
                      l.contains("launching app") || l.contains("please wait") || l.contains("loading")
                  }
                  // If the accessibility tree has <= 3 meaningful app elements, we are on a game/canvas screen
                  val isGame = uiList.size <= 3
                  val visualList = if (!loading) detectVisualObjects(bmp, screenW, screenH, isGame) else emptyList()

                  val all = ArrayList<TrackedObject>(uiList.size + visualList.size)
                  all.addAll(visualList)
                  all.addAll(uiList)
                  val byId = LinkedHashMap<String, TrackedObject>()
                  for (o in all) byId[o.id.lowercase()] = o

                  val summary = buildPromptSummary(uiList, visualList, isGame)
                  return LocalSceneState(
                      objects = all,
                      byId = byId,
                      isGameCanvas = isGame,
                      isLoadingOverlay = loading,
                      promptSummary = summary,
                  )
              }

              /**
               * Enforces the Touch Contract (`عقد اللمس`) from `hands-fast-vision.md`:
               * 1. If an explicit object ID (`c1`, `green_btn`, `u1`) is given and exists in `scene.byId`,
               *    injects at that object's live bounding box center.
               * 2. If coordinates `[gx, gy]` are given, maps `[gx, gy]` directly to `(px, py)` on the
               *    device (`device_x = gx * screenW / 1000`, `device_y = gy * screenH / 1000`).
               *    NEVER replaces `[gx, gy]` with a distant text search! Only refines by <= 8% of screen
               *    height if an exact UI icon (`u1..uN`) is right next to `(px, py)`.
               * 3. Enforces strict Danger Zone vetoes so a tap for `Level 5` / `Level 6` / `Continue` / cars
               *    can NEVER land on the Coin `+` bar `(551, 208)` or the Shop tab.
               */
              fun resolveWithContract(
                  svc: MinisAccessibilityService,
                  bmp: Bitmap?,
                  scene: LocalSceneState,
                  action: HandsAction,
                  screenW: Int,
                  screenH: Int,
              ): ResolvedTap {
                  val objId = when (action) {
                      is HandsAction.Click -> action.objectId.trim().lowercase()
                      is HandsAction.DoubleTap -> action.objectId.trim().lowercase()
                      is HandsAction.LongPress -> action.objectId.trim().lowercase()
                      else -> ""
                  }
                  val target = action.tapTarget.orEmpty().trim()
                  val pt = when (action) {
                      is HandsAction.Click -> action.at
                      is HandsAction.DoubleTap -> action.at
                      is HandsAction.LongPress -> action.at
                      else -> HandsAction.Point(500, 500)
                  }

                  var px: Int
                  var py: Int
                  var boxPx: Rect? = null
                  var source = "coord[${pt.gx},${pt.gy}]"

                  val rawPair = pt.toPixels(screenW, screenH)
                  px = rawPair.first
                  py = rawPair.second
                  val hasExplicitCoord = !(pt.gx == 500 && pt.gy == 500 && objId.isNotEmpty())

                  val tracked = if (objId.isNotEmpty()) scene.byId[objId] else null
                  val trackedDist = if (tracked != null) hypot((tracked.tapX - px).toDouble(), (tracked.tapY - py).toDouble()) else Double.MAX_VALUE
                  // Only trust `tracked` by ID if no explicit coordinate was given, OR if `tracked` is close to the coordinate,
                  // OR if `tracked` explicitly matches `target` (prevents a wrong `uN` ID from hijacking a Calculator digit tap!)
                  if (tracked != null && (!hasExplicitCoord || trackedDist <= screenH * 0.12 || tracked.matchesTarget(target))) {
                      px = tracked.tapX.coerceIn(tracked.boxPx.left, (tracked.boxPx.right - 1).coerceAtLeast(tracked.boxPx.left))
                      py = tracked.tapY.coerceIn(tracked.boxPx.top, (tracked.boxPx.bottom - 1).coerceAtLeast(tracked.boxPx.top))
                      boxPx = tracked.boxPx
                      source = "id:$objId->(${px},${py})"
                  } else {
                      val tLower = target.lowercase()
                      val greenBtn = scene.byId["green_btn"]
                      if (greenBtn != null &&
                          (tLower.contains("level") || tLower.contains("continue") || tLower.contains("play") || objId == "green_btn") &&
                          hypot((greenBtn.tapX - px).toDouble(), (greenBtn.tapY - py).toDouble()) <= screenH * 0.18
                      ) {
                          px = greenBtn.tapX
                          py = greenBtn.tapY
                          boxPx = greenBtn.boxPx
                          source = "green_btn->(${px},${py})"
                      } else if (target.isNotEmpty() && !scene.isGameCanvas) {
                          // In standard UI apps (Calculator, Clone Space, etc.), find UI elements whose text/desc/label matches `target`
                          val exactUi = scene.objects.filter {
                              it.id.startsWith("u") && it.matchesTarget(target)
                          }
                          val nearUi = exactUi.minByOrNull { hypot((it.tapX - px).toDouble(), (it.tapY - py).toDouble()) }
                          // Snap if within 12% of screen height (e.g. Calculator button or Clone Space icon+label)
                          if (nearUi != null && hypot((nearUi.tapX - px).toDouble(), (nearUi.tapY - py).toDouble()) <= screenH * 0.12) {
                              px = nearUi.tapX
                              py = nearUi.tapY
                              boxPx = nearUi.boxPx
                              source = "ui_match:${nearUi.id}->(${px},${py})"
                          }
                      }
                  }

                  px = px.coerceIn(0, screenW - 1)
                  py = py.coerceIn(0, screenH - 1)

                  // Check explicit Danger Zones (Coin `+` bar, Shop tab, top settings) when not explicitly requested
                  val veto = checkDangerZone(px, py, target, objId, screenW, screenH, scene.isGameCanvas)
                  val underDesc = describeUnderFinger(svc, bmp, px, py, screenW, screenH)
                  return ResolvedTap(
                      px = px,
                      py = py,
                      boxPx = boxPx,
                      vetoReason = veto,
                      underFingerDesc = underDesc,
                      resolvedFrom = source,
                  )
              }

              /**
               * Explicit Danger Zone guard (`مناطق ممنوعة صريحة` in `hands-fast-vision.md`):
               * Blocks taps that land on the Coin `+` bar (`y ~ 208px` / `gy in 45..125`), Hearts `+`,
               * or the bottom-left Shop tab (`gx in 0..205, gy in 880..999`) unless the user/model
               * explicitly named coin/shop/settings.
               */
              fun checkDangerZone(
                  px: Int,
                  py: Int,
                  target: String,
                  objId: String,
                  screenW: Int,
                  screenH: Int,
                  isGameCanvas: Boolean,
              ): String? {
                  if (!isGameCanvas || screenW <= 0 || screenH <= 0) return null
                  val gx = px * 1000 / screenW
                  val gy = py * 1000 / screenH
                  val tLower = (target + " " + objId).lowercase()
                  val wantsShopOrCoin = tLower.contains("shop") || tLower.contains("store") ||
                      tLower.contains("coin") || tLower.contains("متجر") || tLower.contains("عملة")
                  val wantsSettings = tLower.contains("setting") || tLower.contains("gear") ||
                      tLower.contains("pause") || tLower.contains("إعدادات")

                  val isGameplayTarget = tLower.contains("level") || tLower.contains("continue") ||
                      tLower.contains("play") || tLower.contains("car") || tLower.contains("tile") ||
                      tLower.contains("piece") || tLower.contains("block") || objId.startsWith("c") || objId == "green_btn"

                  // 1. Top Coin `+` and Hearts `+` HUD bar (gx in 200..780, gy in 45..125): veto when aiming at gameplay/level targets
                  if (!wantsShopOrCoin && isGameplayTarget && gx in 200..780 && gy in 45..125) {
                      return "FORBIDDEN_DANGER_ZONE: tap at ($px, $py) [grid $gx,$gy] lands on the top Coin/Hearts (+) HUD bar while targeting '$target'"
                  }
                  // 2. Top-right Settings gear in game HUD (gx in 820..980, gy in 45..130): veto when aiming at gameplay/level targets
                  if (!wantsSettings && isGameplayTarget && gx in 820..980 && gy in 45..130) {
                      return "FORBIDDEN_DANGER_ZONE: tap at ($px, $py) [grid $gx,$gy] lands on the top-right HUD button while targeting '$target'"
                  }
                  // 3. Bottom-left Shop tab on Home screen (gx in 0..205, gy in 880..999) when trying to tap Level/Play/Continue/car
                  if (!wantsShopOrCoin && gx in 0..205 && gy in 880..999 &&
                      (tLower.contains("level") || tLower.contains("continue") || tLower.contains("play") || tLower.contains("car"))
                  ) {
                      return "FORBIDDEN_DANGER_ZONE: tap at ($px, $py) [grid $gx,$gy] lands on the bottom-left Shop tab while targeting '$target'"
                  }
                  return null
              }

              private fun describeUnderFinger(
                  svc: MinisAccessibilityService,
                  bmp: Bitmap?,
                  px: Int,
                  py: Int,
                  screenW: Int,
                  screenH: Int,
              ): String {
                  val a11yWord = at(svc, px, py)
                  var colorDesc = ""
                  if (bmp != null && screenW > 0 && screenH > 0) {
                      val bx = (px.toLong() * bmp.width / screenW).toInt().coerceIn(0, bmp.width - 1)
                      val by = (py.toLong() * bmp.height / screenH).toInt().coerceIn(0, bmp.height - 1)
                      val c = bmp.getPixel(bx, by)
                      val r = Color.red(c)
                      val g = Color.green(c)
                      val b = Color.blue(c)
                      colorDesc = "${classifyColorName(r, g, b)}(#$r,$g,$b)"
                  }
                  return listOfNotNull(a11yWord?.let { "ui='$it'" }, colorDesc.takeIf { it.isNotEmpty() }).joinToString(",")
              }

              /**
               * Fast local computer-vision detector (<30ms on 540x1200 bitmap):
               * - Detects the large green Level/Continue button (`green_btn`) around gy 680..850.
               * - Detects colored game pieces/cars (`c1..cN`) in the board area (`gy 220..715`),
               *   including whether each piece has white+black cartoon eye contrast (`freeOrEyes`).
               */
              private fun detectVisualObjects(
                  bmp: Bitmap,
                  screenW: Int,
                  screenH: Int,
                  isGame: Boolean,
              ): List<TrackedObject> {
                  if (!isGame || bmp.width < 100 || bmp.height < 100) return emptyList()
                  val w = bmp.width
                  val h = bmp.height
                  val out = ArrayList<TrackedObject>()

                  // 1. Check for the large Green Button ("Level N" / "Continue") in gy 680..850, gx 240..760
                  var greenCount = 0
                  var gxSum = 0L
                  var gySum = 0L
                  var gMinX = w
                  var gMaxX = 0
                  var gMinY = h
                  var gMaxY = 0
                  val yStartBtn = (h * 680) / 1000
                  val yEndBtn = (h * 850) / 1000
                  val xStartBtn = (w * 240) / 1000
                  val xEndBtn = (w * 760) / 1000
                  var y = yStartBtn
                  while (y <= yEndBtn) {
                      var x = xStartBtn
                      while (x <= xEndBtn) {
                          val c = bmp.getPixel(x, y)
                          val r = Color.red(c)
                          val g = Color.green(c)
                          val b = Color.blue(c)
                          // Bright green button surface (high green, low red & blue)
                          if (g > 155 && g - r > 55 && g - b > 80) {
                              greenCount++
                              gxSum += x
                              gySum += y
                              if (x < gMinX) gMinX = x
                              if (x > gMaxX) gMaxX = x
                              if (y < gMinY) gMinY = y
                              if (y > gMaxY) gMaxY = y
                          }
                          x += 6
                      }
                      y += 6
                  }
                  if (greenCount >= 45 && (gMaxX - gMinX) >= w / 4 && (gMaxY - gMinY) >= h / 25) {
                      val cxBmp = (gxSum / greenCount).toInt()
                      val cyBmp = (gySum / greenCount).toInt()
                      val tapX = (cxBmp.toLong() * screenW / w).toInt().coerceIn(0, screenW - 1)
                      val tapY = (cyBmp.toLong() * screenH / h).toInt().coerceIn(0, screenH - 1)
                      val gx = (tapX * 1000 / screenW).coerceIn(0, 999)
                      val gy = (tapY * 1000 / screenH).coerceIn(0, 999)
                      val boxPx = Rect(
                          (gMinX.toLong() * screenW / w).toInt(),
                          (gMinY.toLong() * screenH / h).toInt(),
                          (gMaxX.toLong() * screenW / w).toInt(),
                          (gMaxY.toLong() * screenH / h).toInt(),
                      )
                      val boxGrid = intArrayOf(
                          (gMinX * 1000 / w).coerceIn(0, 999),
                          (gMinY * 1000 / h).coerceIn(0, 999),
                          (gMaxX * 1000 / w).coerceIn(0, 999),
                          (gMaxY * 1000 / h).coerceIn(0, 999),
                      )
                      out.add(
                          TrackedObject(
                              id = "green_btn",
                              kind = "Button",
                              label = "Green Level/Continue Button",
                              colorName = "green",
                              gx = gx,
                              gy = gy,
                              tapX = tapX,
                              tapY = tapY,
                              boxPx = boxPx,
                              boxGrid = boxGrid,
                              freeOrEyes = true,
                              clickable = true,
                          )
                      )
                  }

                  // 2. Scan the playable board area (gy 240..700) on a 7x7 grid of cells for distinct game pieces/cars
                  //    and check if each cell contains the white+black eye sclera/pupil contrast (`👀`).
                  val cols = 7
                  val rows = 7
                  val boardLeft = (w * 45) / 1000
                  val boardRight = (w * 955) / 1000
                  val boardTop = (h * 255) / 1000
                  val boardBottom = (h * 685) / 1000
                  val cellW = ((boardRight - boardLeft) / cols).coerceAtLeast(10)
                  val cellH = ((boardBottom - boardTop) / rows).coerceAtLeast(10)

                  var carIdx = 1
                  for (rIdx in 0 until rows) {
                      val cyTop = boardTop + rIdx * cellH
                      val cyBot = cyTop + cellH
                      for (cIdx in 0 until cols) {
                          val cxLeft = boardLeft + cIdx * cellW
                          val cxRight = cxLeft + cellW
                          val colorCounts = IntArray(7) // 1:red, 2:yellow, 3:green, 4:blue, 5:purple, 6:cyan
                          var sumX = 0
                          var sumY = 0
                          var coloredSamples = 0
                          var whiteEyePixels = 0
                          var darkPupilPixels = 0

                          var sy = cyTop + 4
                          while (sy < cyBot - 4) {
                              var sx = cxLeft + 4
                              while (sx < cxRight - 4) {
                                  val p = bmp.getPixel(sx, sy)
                                  val pr = Color.red(p)
                                  val pg = Color.green(p)
                                  val pb = Color.blue(p)
                                  if (pr > 225 && pg > 225 && pb > 225) {
                                      whiteEyePixels++
                                  } else if (pr < 48 && pg < 48 && pb < 48) {
                                      darkPupilPixels++
                                  } else {
                                      val cid = classifyGameColorId(pr, pg, pb)
                                      if (cid > 0) {
                                          colorCounts[cid]++
                                          sumX += sx
                                          sumY += sy
                                          coloredSamples++
                                      }
                                  }
                                  sx += 5
                              }
                              sy += 5
                          }

                          if (coloredSamples >= 22) {
                              var bestCid = 0
                              var bestCnt = 0
                              for (cid in 1..6) {
                                  if (colorCounts[cid] > bestCnt) {
                                      bestCnt = colorCounts[cid]
                                      bestCid = cid
                                  }
                              }
                              if (bestCnt >= 14) {
                                  val centerBmpX = sumX / coloredSamples
                                  val centerBmpY = sumY / coloredSamples
                                  val hasEyes = whiteEyePixels >= 3 && darkPupilPixels >= 2
                                  val tapX = (centerBmpX.toLong() * screenW / w).toInt().coerceIn(0, screenW - 1)
                                  val tapY = (centerBmpY.toLong() * screenH / h).toInt().coerceIn(0, screenH - 1)
                                  val gx = (tapX * 1000 / screenW).coerceIn(0, 999)
                                  val gy = (tapY * 1000 / screenH).coerceIn(0, 999)
                                  // Deduplicate if very close to an already added car of the same color
                                  val colorStr = colorIdName(bestCid)
                                  val dup = out.any {
                                      it.id.startsWith("c") && it.colorName == colorStr &&
                                          abs(it.gx - gx) < 55 && abs(it.gy - gy) < 45
                                  }
                                  if (!dup && carIdx <= 28) {
                                      val id = "c$carIdx"
                                      carIdx++
                                      val boxPx = Rect(
                                          (cxLeft.toLong() * screenW / w).toInt(),
                                          (cyTop.toLong() * screenH / h).toInt(),
                                          (cxRight.toLong() * screenW / w).toInt(),
                                          (cyBot.toLong() * screenH / h).toInt(),
                                      )
                                      val boxGrid = intArrayOf(
                                          (cxLeft * 1000 / w).coerceIn(0, 999),
                                          (cyTop * 1000 / h).coerceIn(0, 999),
                                          (cxRight * 1000 / w).coerceIn(0, 999),
                                          (cyBot * 1000 / h).coerceIn(0, 999),
                                      )
                                      out.add(
                                          TrackedObject(
                                              id = id,
                                              kind = "GamePiece",
                                              label = "$colorStr piece",
                                              colorName = colorStr,
                                              gx = gx,
                                              gy = gy,
                                              tapX = tapX,
                                              tapY = tapY,
                                              boxPx = boxPx,
                                              boxGrid = boxGrid,
                                              freeOrEyes = hasEyes,
                                              clickable = true,
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  }
                  return out
              }

              private fun classifyGameColorId(r: Int, g: Int, b: Int): Int {
                  val max = maxOf(r, g, b)
                  val min = minOf(r, g, b)
                  if (max - min < 55 || max < 95) return 0 // grey/road/background
                  return when {
                      r > 175 && g < 95 && b < 95 -> 1 // red
                      r > 195 && g > 150 && b < 90 -> 2 // yellow
                      g > 145 && r < 120 && b < 105 -> 3 // green
                      b > 170 && r < 110 && g in 80..185 -> 4 // blue
                      r > 135 && b > 145 && g < 100 -> 5 // purple
                      b > 185 && g > 165 && r < 120 -> 6 // cyan
                      else -> 0
                  }
              }

              private fun colorIdName(cid: Int): String = when (cid) {
                  1 -> "red"
                  2 -> "yellow"
                  3 -> "green"
                  4 -> "blue"
                  5 -> "purple"
                  6 -> "cyan"
                  else -> "neutral"
              }

              private fun classifyColorName(r: Int, g: Int, b: Int): String {
                  val cid = classifyGameColorId(r, g, b)
                  if (cid > 0) return colorIdName(cid)
                  val lum = (r * 299 + g * 587 + b * 114) / 1000
                  return when {
                      lum > 220 -> "white"
                      lum < 45 -> "black"
                      else -> "grey"
                  }
              }

              private fun buildPromptSummary(
                  uiList: List<TrackedObject>,
                  visualList: List<TrackedObject>,
                  isGame: Boolean,
              ): String {
                  val root = JSONObject()
                  root.put("screen_mode", if (isGame) "game_or_canvas" else "app_ui")
                  if (uiList.isNotEmpty()) {
                      val arr = JSONArray()
                      for (u in uiList.take(35)) {
                          arr.put(
                              JSONObject()
                                  .put("id", u.id)
                                  .put("label", u.label)
                                  .put("tap", JSONArray().put(u.gx).put(u.gy))
                                  .put("box", JSONArray(u.boxGrid))
                          )
                      }
                      root.put("ui_elements", arr)
                  }
                  if (visualList.isNotEmpty()) {
                      val greenBtn = visualList.firstOrNull { it.id == "green_btn" }
                      if (greenBtn != null) {
                          root.put(
                              "green_button",
                              JSONObject()
                                  .put("id", "green_btn")
                                  .put("tap", JSONArray().put(greenBtn.gx).put(greenBtn.gy))
                                  .put("box", JSONArray(greenBtn.boxGrid))
                          )
                      }
                      val pieces = visualList.filter { it.id.startsWith("c") }
                          .sortedWith(compareByDescending<TrackedObject> { it.freeOrEyes }.thenByDescending { it.gy })
                      if (pieces.isNotEmpty()) {
                          val arr = JSONArray()
                          for (c in pieces.take(22)) {
                              arr.put(
                                  JSONObject()
                                      .put("id", c.id)
                                      .put("color", c.colorName)
                                      .put("tap", JSONArray().put(c.gx).put(c.gy))
                                      .put("eye_contrast", c.freeOrEyes)
                              )
                          }
                          root.put("tracked_objects", arr)
                      }
                  }
                  if (isGame) {
                      root.put(
                          "forbidden_danger_zones",
                          JSONArray()
                              .put("coin_and_hearts_top_bar: gx 200..780, gy 45..125 (NEVER TAP)")
                              .put("settings_top_right: gx 820..980, gy 45..130 (NEVER TAP)")
                              .put("shop_bottom_left_tab: gx 0..205, gy 880..999 (NEVER TAP)")
                      )
                  }
                  return "Local Fast-Vision State (0–999 grid):\n" + root.toString()
              }

              private fun collectUiElements(svc: MinisAccessibilityService, screenW: Int, screenH: Int): List<TrackedObject> {
                  if (screenW <= 0 || screenH <= 0) return emptyList()
                  val raw = ArrayList<TrackedObject>()
                  val seen = HashSet<String>()
                  try {
                      for (root in svc.rootNodes()) {
                          walkUi(root, 0, screenW, screenH, raw, seen)
                      }
                  } catch (_: Throwable) {}
                  val sorted = raw.sortedWith(compareBy<TrackedObject>({ it.gy }, { it.gx }))
                  return sorted.mapIndexed { idx, item -> item.copy(id = "u${idx + 1}") }
              }

              private fun walkUi(
                  node: AccessibilityNodeInfo?,
                  depth: Int,
                  screenW: Int,
                  screenH: Int,
                  out: MutableList<TrackedObject>,
                  seen: MutableSet<String>,
              ) {
                  if (node == null || depth > 55 || out.size >= 60) return
                  try {
                      if (!node.isVisibleToUser) return
                      val bounds = Rect()
                      node.getBoundsInScreen(bounds)
                      if (bounds.width() > 8 && bounds.height() > 8 &&
                          bounds.right > 0 && bounds.bottom > 0 &&
                          bounds.left < screenW && bounds.top < screenH
                      ) {
                          val lbl = label(node)
                          if (!lbl.isNullOrBlank()) {
                              val (tapX, tapY, tapBounds, isClick) = computeOptimalTap(node, bounds, screenW, screenH)
                              val gx = Math.round(tapX * 1000.0 / screenW).toInt().coerceIn(0, 999)
                              val gy = Math.round(tapY * 1000.0 / screenH).toInt().coerceIn(0, 999)
                              val key = "${lbl.lowercase()}_${gx / 25}_${gy / 25}"
                              if (seen.add(key)) {
                                  val simpleClass = node.className?.toString()?.substringAfterLast('.') ?: "View"
                                  val boxGrid = intArrayOf(
                                      (tapBounds.left * 1000 / screenW).coerceIn(0, 999),
                                      (tapBounds.top * 1000 / screenH).coerceIn(0, 999),
                                      (tapBounds.right * 1000 / screenW).coerceIn(0, 999),
                                      (tapBounds.bottom * 1000 / screenH).coerceIn(0, 999),
                                  )
                                  val rText = node.text?.toString()?.trim().orEmpty()
                                  val rDesc = node.contentDescription?.toString()?.trim().orEmpty()
                                  out.add(
                                      TrackedObject(
                                          id = "u0",
                                          kind = simpleClass,
                                          label = lbl.take(60),
                                          rawText = rText.take(40),
                                          rawDesc = rDesc.take(40),
                                          colorName = "ui",
                                          gx = gx,
                                          gy = gy,
                                          tapX = tapX,
                                          tapY = tapY,
                                          boxPx = tapBounds,
                                          boxGrid = boxGrid,
                                          freeOrEyes = true,
                                          clickable = isClick,
                                      )
                                  )
                              }
                          }
                      }
                      for (i in 0 until node.childCount) {
                          walkUi(node.getChild(i), depth + 1, screenW, screenH, out, seen)
                      }
                  } catch (_: Throwable) {}
              }

              private data class TapTargetInfo(val x: Int, val y: Int, val bounds: Rect, val clickable: Boolean)

              private fun computeOptimalTap(
                  node: AccessibilityNodeInfo,
                  bounds: Rect,
                  screenW: Int,
                  screenH: Int,
              ): TapTargetInfo {
                  val clsName = node.className?.toString().orEmpty()
                  // CRITICAL FIX FOR CALCULATOR / KEYPADS / STANDARD BUTTONS:
                  // If the node itself is already clickable or is a Button/EditText, its tap point is ALWAYS
                  // its own exact center (bounds.centerX(), bounds.centerY()) — never shift it to a parent or sibling!
                  if (node.isClickable || node.isEditable || clsName.contains("Button", ignoreCase = true)) {
                      return TapTargetInfo(bounds.centerX(), bounds.centerY(), bounds, true)
                  }
                  // Only for non-clickable single-line text labels (like app names below icons in Clone Space):
                  if (bounds.height() > screenH / 16) {
                      return TapTargetInfo(bounds.centerX(), bounds.centerY(), bounds, node.isClickable)
                  }
                  var clickable = false
                  var p: AccessibilityNodeInfo? = node.parent
                  var up = 0
                  while (p != null && up < 3) {
                      if (p.isClickable) clickable = true
                      val pb = Rect()
                      p.getBoundsInScreen(pb)
                      if (pb.width() in 40..(screenW / 2) &&
                          pb.height() in (bounds.height() + 30)..(screenH / 4) &&
                          pb.top < bounds.top - 20 &&
                          abs(pb.centerX() - bounds.centerX()) <= pb.width() / 3
                      ) {
                          val iconCenterY = (pb.top + bounds.top) / 2
                          return TapTargetInfo(pb.centerX(), iconCenterY, pb, true)
                      }
                      if (up == 0 && p.childCount in 2..12) {
                          for (i in 0 until p.childCount) {
                              val sib = p.getChild(i) ?: continue
                              if (sib == node || !sib.isVisibleToUser) continue
                              val sb = Rect()
                              sib.getBoundsInScreen(sb)
                              if (sb.width() in 36..(screenW / 2) &&
                                  sb.height() in 36..(screenH / 5) &&
                                  abs(sb.centerX() - bounds.centerX()) <= maxOf(sb.width(), bounds.width()) / 2 &&
                                  sb.bottom <= bounds.top + 30 &&
                                  bounds.top - sb.top <= screenH / 5
                              ) {
                                  val combined = Rect(
                                      minOf(sb.left, bounds.left),
                                      sb.top,
                                      maxOf(sb.right, bounds.right),
                                      bounds.bottom,
                                  )
                                  return TapTargetInfo(sb.centerX(), sb.centerY(), combined, clickable || sib.isClickable)
                              }
                          }
                      }
                      p = p.parent
                      up++
                  }
                  return TapTargetInfo(bounds.centerX(), bounds.centerY(), bounds, clickable)
              }

              private fun label(node: AccessibilityNodeInfo): String? {
                  val text = node.text?.toString()?.trim().orEmpty()
                  val desc = node.contentDescription?.toString()?.trim().orEmpty()
                  val hint = node.hintText?.toString()?.trim().orEmpty()
                  return listOf(text, desc, hint).filter { it.isNotEmpty() }.distinct().joinToString(" ").ifBlank { null }
              }

              private fun deepestAt(node: AccessibilityNodeInfo, x: Int, y: Int, depth: Int): AccessibilityNodeInfo? {
                  if (depth > 60) return null
                  val bounds = Rect()
                  node.getBoundsInScreen(bounds)
                  if (!bounds.contains(x, y)) return null
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      deepestAt(child, x, y, depth + 1)?.let { return it }
                  }
                  return node
              }
          }
          EOF_SCREEN_WORDS

          cat << 'EOF_HANDS_ACTION' > "$HANDS_MAIN/HandsAction.kt"
          package io.github.nanomuse.hands

          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * What the screen model can do on the phone — either one action or a multi-step plan
           * (`Action: [...]` up to [MAX_BATCH] steps executed locally at 150ms intervals).
           * Supports both `[gx, gy]` coordinates on the 0–999 grid AND tracked object IDs
           * (`"id": "c1"`, `"id": "green_btn"`, `"id": "u1"`).
           */
          sealed class HandsAction {
              /** A point on the 0–999 grid of the screenshot. */
              data class Point(val gx: Int, val gy: Int) {
                  fun toPixels(screenW: Int, screenH: Int): Pair<Int, Int> =
                      Math.round(gx * screenW / GRID.toDouble()).toInt().coerceIn(0, screenW - 1) to
                          Math.round(gy * screenH / GRID.toDouble()).toInt().coerceIn(0, screenH - 1)
              }

              data class Click(
                  val at: Point,
                  val target: String,
                  val objectId: String = "",
                  val whenCond: String = "now",
                  val gapMs: Long = 150L,
              ) : HandsAction() {
                  override fun equals(other: Any?): Boolean =
                      other is Click && at == other.at && target == other.target
                  override fun hashCode(): Int = 31 * at.hashCode() + target.hashCode()
              }

              data class DoubleTap(val at: Point, val target: String, val objectId: String = "") : HandsAction() {
                  override fun equals(other: Any?): Boolean =
                      other is DoubleTap && at == other.at && target == other.target
                  override fun hashCode(): Int = 31 * at.hashCode() + target.hashCode()
              }

              data class LongPress(val at: Point, val target: String, val objectId: String = "") : HandsAction() {
                  override fun equals(other: Any?): Boolean =
                      other is LongPress && at == other.at && target == other.target
                  override fun hashCode(): Int = 31 * at.hashCode() + target.hashCode()
              }

              data class Swipe(val from: Point, val to: Point) : HandsAction()
              /** Scroll the content in [direction]: `down` reveals what is below. */
              data class Scroll(val direction: String) : HandsAction()
              data class InputText(val text: String, val field: String) : HandsAction()
              object KeyboardEnter : HandsAction()
              data class OpenApp(val appName: String) : HandsAction()
              object Back : HandsAction()
              object Home : HandsAction()
              data class Wait(val seconds: Int) : HandsAction()
              /** Logins, passwords, codes, captchas, protected pages: the user does it and taps Continue. */
              data class TakeOver(val reason: String) : HandsAction()
              /** The model needs something only the user knows; the task pauses and the chat asks. */
              data class AskUser(val question: String) : HandsAction()
              data class Status(val complete: Boolean, val answer: String) : HandsAction()

              /** The label the guard reads, for taps; null for everything else. */
              val tapTarget: String?
                  get() = when (this) {
                      is Click -> target
                      is DoubleTap -> target
                      is LongPress -> target
                      else -> null
                  }

              /** One line for the capsule and the trace. */
              fun describe(): String = when (this) {
                  is Click -> if (target.isNotBlank()) "tap “${target.take(40)}”" else if (objectId.isNotBlank()) "tap #$objectId" else "tap"
                  is DoubleTap -> if (target.isNotBlank()) "double-tap “${target.take(40)}”" else "double-tap"
                  is LongPress -> if (target.isNotBlank()) "hold “${target.take(40)}”" else "long press"
                  is Swipe -> "swipe"
                  is Scroll -> "scroll $direction"
                  is InputText -> if (field.isNotBlank()) "type into ${field.take(40)}" else "type"
                  KeyboardEnter -> "enter"
                  is OpenApp -> "open ${appName.take(40)}"
                  Back -> "back"
                  Home -> "home"
                  is Wait -> "wait ${seconds}s"
                  is TakeOver -> "your turn"
                  is AskUser -> "question for you"
                  is Status -> if (complete) "done" else "cannot finish"
              }

              companion object {
                  const val GRID = 1000

                  /** `Thought:` and `Action:` pulled out of a reply. [actions] carries the batch
                   *  when the model answered with a JSON array; [action] stays the first of them
                   *  so single-action callers are unaffected. */
                  data class Parsed(val thought: String, val action: HandsAction, val raw: String, val actions: List<HandsAction> = listOf(action))

                  /** How many actions one reply may batch in a single fast plan (`hands-fast-vision.md`). */
                  const val MAX_BATCH = 12

                  class FormatError(message: String) : Exception(message)

                  private val aliases = mapOf(
                      "click" to "click", "tap" to "click", "press" to "click", "touch" to "click",
                      "long_press" to "long_press", "long_tap" to "long_press", "hold" to "long_press", "longpress" to "long_press",
                      "double_tap" to "double_tap", "double_click" to "double_tap", "doubletap" to "double_tap",
                      "swipe" to "swipe", "drag" to "swipe", "fling" to "swipe",
                      "scroll" to "scroll",
                      "input_text" to "input_text", "type" to "input_text", "enter_text" to "input_text", "write" to "input_text", "type_text" to "input_text",
                      "keyboard_enter" to "keyboard_enter", "enter" to "keyboard_enter", "press_enter" to "keyboard_enter",
                      "open_app" to "open_app", "launch" to "open_app", "launch_app" to "open_app", "open" to "open_app",
                      "navigate_back" to "navigate_back", "back" to "navigate_back",
                      "navigate_home" to "navigate_home", "home" to "navigate_home",
                      "wait" to "wait",
                      "take_over" to "take_over", "takeover" to "take_over", "handoff" to "take_over", "hand_over" to "take_over",
                      "ask_user" to "ask_user", "ask" to "ask_user",
                      "status" to "status", "answer" to "status", "finish" to "status", "done" to "status", "complete" to "status", "terminate" to "status",
                  )

                  fun parse(reply: String): Parsed {
                      val text = reply.trim()
                      val idx = text.lastIndexOf("Action:")
                      if (idx < 0) throw FormatError("no `Action:` line")
                      var thought = text.substring(0, idx).replace(Regex("<think>[\\s\\S]*?</think>"), "").trim()
                      if (thought.startsWith("Thought:")) thought = thought.removePrefix("Thought:").trim()
                      val tail = text.substring(idx + "Action:".length)
                      val array = extractJsonArray(tail)
                      if (array != null) {
                          if (array.length() == 0) throw FormatError("the action array is empty")
                          val list = mutableListOf<HandsAction>()
                          for (i in 0 until array.length()) {
                              val o = array.optJSONObject(i) ?: continue
                              list.addAll(expandJsonObject(o))
                          }
                          if (list.isEmpty()) throw FormatError("the action array has no JSON objects")
                          val capped = list.take(MAX_BATCH)
                          return Parsed(thought, capped.first(), text, capped)
                      }
                      val json = extractJson(tail)
                          ?: throw FormatError("the action is not a JSON object")
                      val expanded = expandJsonObject(json)
                      val capped = expanded.take(MAX_BATCH)
                      return Parsed(thought, capped.first(), text, capped)
                  }

                  /**
                   * Supports both standard single action objects AND the `hands-fast-vision.md` plan syntax:
                   * `{"steps": [{"tap": "c3"}, {"tap": ["c4", "c5"], "gap_ms": 150}]}` or
                   * `{"action_type": "click", "id": "c3", "coordinate": [500, 560], "gap_ms": 150}`.
                   */
                  private fun expandJsonObject(o: JSONObject): List<HandsAction> {
                      val stepsArr = o.optJSONArray("steps")
                      if (stepsArr != null && stepsArr.length() > 0) {
                          val out = mutableListOf<HandsAction>()
                          for (i in 0 until stepsArr.length()) {
                              val stepObj = stepsArr.optJSONObject(i) ?: continue
                              out.addAll(expandJsonObject(stepObj))
                          }
                          if (out.isNotEmpty()) return out
                      }
                      val tapArr = o.optJSONArray("tap")
                      if (tapArr != null && tapArr.length() > 0) {
                          val gap = o.optLong("gap_ms", 150L).coerceIn(80L, 600L)
                          val whenCond = o.optString("when", "each_free")
                          val out = mutableListOf<HandsAction>()
                          for (i in 0 until tapArr.length()) {
                              val idStr = tapArr.optString(i).trim()
                              if (idStr.isNotEmpty()) {
                                  out.add(Click(Point(500, 500), idStr, objectId = idStr, whenCond = whenCond, gapMs = gap))
                              }
                          }
                          if (out.isNotEmpty()) return out
                      }
                      return listOf(fromJson(o))
                  }

                  /** A JSON array of actions, when it starts before any object does; null otherwise. */
                  internal fun extractJsonArray(tail: String): JSONArray? {
                      val s = tail.trim().removePrefix("```json").removePrefix("```").trim()
                      val start = s.indexOf('[')
                      if (start < 0) return null
                      val objStart = s.indexOf('{')
                      if (objStart in 0 until start) return null
                      var depth = 0
                      var inString = false
                      var escaped = false
                      for (i in start until s.length) {
                          val c = s[i]
                          if (inString) {
                              when {
                                  escaped -> escaped = false
                                  c == '\\' -> escaped = true
                                  c == '"' -> inString = false
                              }
                              continue
                          }
                          when (c) {
                              '"' -> inString = true
                              '[' -> depth++
                              ']' -> {
                                  depth--
                                  if (depth == 0) return runCatching { JSONArray(s.substring(start, i + 1)) }.getOrNull()
                              }
                          }
                      }
                      return null
                  }

                  internal fun extractJson(tail: String): JSONObject? {
                      val s = tail.trim().removePrefix("```json").removePrefix("```").trim()
                      val start = s.indexOf('{')
                      if (start < 0) return null
                      var depth = 0
                      var inString = false
                      var escaped = false
                      for (i in start until s.length) {
                          val c = s[i]
                          if (inString) {
                              when {
                                  escaped -> escaped = false
                                  c == '\\' -> escaped = true
                                  c == '"' -> inString = false
                              }
                              continue
                          }
                          when (c) {
                              '"' -> inString = true
                              '{' -> depth++
                              '}' -> {
                                  depth--
                                  if (depth == 0) return runCatching { JSONObject(s.substring(start, i + 1)) }.getOrNull()
                              }
                          }
                      }
                      return null
                  }

                  fun fromJson(o: JSONObject): HandsAction {
                      // Support shorthand `{"tap": "c3"}` from hands-fast-vision.md
                      val shorthandTapId = o.optString("tap").trim()
                      val rawType = (o.optString("action_type").ifBlank { o.optString("action") }.ifBlank {
                          if (shorthandTapId.isNotEmpty()) "click" else ""
                      }).trim().lowercase().replace(' ', '_')
                      val type = aliases[rawType] ?: throw FormatError("unknown action_type “$rawType”")
                      val objId = o.optString("id").ifBlank { shorthandTapId }.trim()
                      val whenCond = o.optString("when", "now").trim()
                      val gapMs = o.optLong("gap_ms", 150L).coerceIn(80L, 600L)

                      fun pointOrNull(key: String): Point? {
                          val arr: JSONArray = o.optJSONArray(key)
                              ?: o.optJSONArray("element")?.takeIf { key == "coordinate" }
                              ?: o.optJSONArray("coordinates")?.takeIf { key == "coordinate" }
                              ?: o.optJSONArray("tap")?.takeIf { key == "coordinate" && o.optJSONArray("tap")?.length() == 2 }
                              ?: return null
                          if (arr.length() != 2) throw FormatError("$key must be [x, y]")
                          return Point(clampGrid(arr.optDouble(0)), clampGrid(arr.optDouble(1)))
                      }
                      fun point(key: String): Point = pointOrNull(key) ?: throw FormatError("missing $key")

                      val target = o.optString("target").ifBlank { o.optString("element_description") }.ifBlank { o.optString("label") }.ifBlank { objId }.trim()
                      return when (type) {
                          "click" -> {
                              val pt = pointOrNull("coordinate") ?: if (objId.isNotEmpty()) Point(500, 500) else throw FormatError("missing coordinate")
                              Click(pt, target, objectId = objId, whenCond = whenCond, gapMs = gapMs)
                          }
                          "double_tap" -> {
                              val pt = pointOrNull("coordinate") ?: if (objId.isNotEmpty()) Point(500, 500) else throw FormatError("missing coordinate")
                              DoubleTap(pt, target, objectId = objId)
                          }
                          "long_press" -> {
                              val pt = pointOrNull("coordinate") ?: if (objId.isNotEmpty()) Point(500, 500) else throw FormatError("missing coordinate")
                              LongPress(pt, target, objectId = objId)
                          }
                          "swipe" -> {
                              val from = if (o.has("start_coordinate")) point("start_coordinate") else point("coordinate")
                              val to = if (o.has("end_coordinate")) point("end_coordinate") else {
                                  val dir = o.optString("direction", "up").lowercase()
                                  Point(
                                      (from.gx + when (dir) { "left" -> -400; "right" -> 400; else -> 0 }).coerceIn(0, GRID - 1),
                                      (from.gy + when (dir) { "up" -> -400; "down" -> 400; else -> 0 }).coerceIn(0, GRID - 1),
                                  )
                              }
                              Swipe(from, to)
                          }
                          "scroll" -> {
                              val dir = o.optString("direction", "down").lowercase()
                              if (dir !in setOf("up", "down", "left", "right")) throw FormatError("scroll direction must be up|down|left|right")
                              Scroll(dir)
                          }
                          "input_text" -> InputText(o.optString("text"), o.optString("field").ifBlank { target })
                          "keyboard_enter" -> KeyboardEnter
                          "open_app" -> OpenApp(o.optString("app_name").ifBlank { o.optString("app") }.ifBlank { o.optString("name") }.trim())
                          "navigate_back" -> Back
                          "navigate_home" -> Home
                          "wait" -> Wait(o.optDouble("seconds", 2.0).toInt().coerceIn(1, 10))
                          "take_over" -> TakeOver(o.optString("reason").ifBlank { o.optString("message") })
                          "ask_user" -> AskUser(o.optString("question").ifBlank { o.optString("text") })
                          "status" -> {
                              val status = o.optString("goal_status").ifBlank { o.optString("status") }.lowercase()
                              val answer = o.optString("answer").ifBlank { o.optString("text") }.ifBlank { o.optString("message") }
                              val complete = status in setOf("complete", "completed", "success", "done", "finished") ||
                                  (status.isBlank() && rawType in setOf("answer", "finish", "done", "complete"))
                              Status(complete, answer)
                          }
                          else -> throw FormatError("unknown action_type “$rawType”")
                      }
                  }

                  private fun clampGrid(v: Double): Int {
                      if (v.isNaN()) throw FormatError("coordinate is not a number")
                      val n = if (v > 0 && v <= 1.0) v * GRID else v
                      return n.toInt().coerceIn(0, GRID - 1)
                  }
              }
          }
          EOF_HANDS_ACTION

          cat << 'EOF_HANDS_PROMPT' > "$HANDS_MAIN/HandsPrompt.kt"
          package io.github.nanomuse.hands

          /**
           * Implements the `hands-fast-vision.md` Plan-Once / Fast-Hand prompt contract:
           * The model acts as the strategic planner ("العقل النادر") while the local device
           * executes multi-step tap plans at human speed (150ms between taps) with local
           * motion verification and Touch Contract protection.
           */
          object HandsPrompt {
              fun system(task: String, apps: List<String>, agentName: String, language: String): String = buildString {
                  append("You are the hands of $agentName on the user's Android phone, powered by the Fast-Vision Human-Response Architecture (hands-fast-vision). ")
                  append("You see the current screenshot overlaid with: (1) a calibrated 0–999 yellow coordinate grid `x,y`, (2) tracked object IDs (`green_btn`, `c1..cN`, `u1..uN`), and (3) a red/cyan bullseye marker `LAST_TAP` showing where your previous tap landed.\n\n")
                  append("## Task\n").append(task.trim()).append("\n\n")
                  append("## Fast-Vision Architecture: Plan Once, Execute Locally at Human Speed (150ms)\n")
                  append("Do NOT tap one item at a time and wait when multiple valid moves are visible! Solve as much of the visible board as possible in ONE turn and output a multi-step JSON array (2 to 12 actions) in `Action: [...]`. The phone executes your plan locally at 150ms per tap, verifies motion after each tap, retries missed taps locally, and stops automatically if a new screen/popup appears.\n\n")
                  append("Reply in exactly this form and nothing else:\n")
                  append("Thought: 1-2 concise sentences — (1) current screen/dock state & whether LAST_TAP hit its target, (2) which pieces are UNBLOCKED/FREE right now (in Car Match: ONLY cars with cartoon eyes 👀 on their windshield) and the multi-step sequence you will execute.\n")
                  append("Action: [{\"action_type\":\"click\",\"id\":\"c3\",\"coordinate\":[500,560],\"target\":\"yellow car\",\"gap_ms\":150}, ...]\n")
                  append("(Or a single JSON object `Action: {\"action_type\":\"...\"}` when only 1 action is appropriate, such as tapping `green_btn` to start a level or `status` when complete.)\n\n")
                  append("## Actions (0–999 grid + Object IDs)\n")
                  append("Coordinates are on a 0–999 grid laid over the screenshot: x from left (0) to right (999), y from top (0) to bottom (999).\n")
                  append("- {\"action_type\":\"click\",\"id\":\"optional_id (e.g. green_btn, c1, u1)\",\"coordinate\":[x,y],\"target\":\"what you tap\",\"gap_ms\":150}\n")
                  append("- {\"action_type\":\"long_press\",\"coordinate\":[x,y],\"target\":\"...\"}\n")
                  append("- {\"action_type\":\"double_tap\",\"coordinate\":[x,y],\"target\":\"...\"}\n")
                  append("- {\"action_type\":\"swipe\",\"start_coordinate\":[x,y],\"end_coordinate\":[x,y]}\n")
                  append("- {\"action_type\":\"scroll\",\"direction\":\"down\"} (up, down, left, right)\n")
                  append("- {\"action_type\":\"input_text\",\"text\":\"...\",\"field\":\"what the field is\"}\n")
                  append("- {\"action_type\":\"keyboard_enter\"}\n")
                  append("- {\"action_type\":\"open_app\",\"app_name\":\"...\"} — ONLY use if the app is NOT already on screen!\n")
                  append("- {\"action_type\":\"navigate_back\"} · {\"action_type\":\"navigate_home\"} · {\"action_type\":\"wait\",\"seconds\":1}\n")
                  append("- {\"action_type\":\"take_over\",\"reason\":\"...\"}\n")
                  append("- {\"action_type\":\"ask_user\",\"question\":\"...\"}\n")
                  append("- {\"action_type\":\"status\",\"goal_status\":\"complete\",\"answer\":\"...\"}\n")
                  append("- {\"action_type\":\"status\",\"goal_status\":\"infeasible\",\"answer\":\"why\"}\n\n")
                  if (apps.isNotEmpty()) {
                      append("## Installed apps\n")
                      append(apps.joinToString(", ")).append("\n\n")
                  }
                  append("## Universal Touch, App & Game Rules\n")
                  append("1. UNIVERSAL APP & UI PRECISION: In any standard app (messengers, browsers, settings, cloners like Clone Space, shopping, productivity), check `ui_elements` (`u1..uN`) in the Local Fast-Vision State and use the exact `@ [x, y]` coordinate and `id` of the button, field, or icon you want to tap. You can batch obvious UI sequences (e.g. tap a search box then `input_text` then `keyboard_enter`) in one `Action: [...]` array.\n")
                  append("2. STICKY SESSION (NO RE-LAUNCHING): If the target app or game is ALREADY open on screen, NEVER call `open_app` or navigate home — continue directly from the current screen!\n")
                  append("3. UNIVERSAL GAME & PUZZLE INTELLIGENCE: In any game (puzzle, match-3, board, strategy, arcade, or Car Match), analyze the rules, board constraints, and active pieces before acting: (a) only interact with UNBLOCKED / ACTIVE pieces (e.g. in Car Match, only cars with cartoon eyes 👀 on their windshield have an open exit path — never tap blocked cars without eyes), (b) batch 2 to 12 independent valid moves together with `\"gap_ms\": 150` for human-like speed, and (c) avoid accidental taps on HUD Coin/Shop/Settings bars unless explicitly asked.\n")
                  append("4. STRICT GOAL BOUNDARY: The moment the user's requested task, message, or game level is completed, STOP immediately with `{\"action_type\":\"status\",\"goal_status\":\"complete\",\"answer\":\"...\"}` in $language.\n")
                  append("5. SAFETY & PRIVACY: Never type passwords, PINs, or verification codes (use `take_over`), and before any tap that pays, places an order, sends a message, or deletes data, put the exact button text in `\"target\"` so the user's approval card can verify it.\n")
              }

              /** The text that goes with a screenshot: the step number and what the last action did. */
              fun turnText(step: Int, lastResult: String?): String = buildString {
                  append("Step ").append(step).append(". ")
                  if (lastResult != null) append("Result of the last action: ").append(lastResult).append(" ")
                  append("Here is the screen now.")
              }

              const val OLDER_SCREEN = "(An earlier screen — not shown again.)"
          }
          EOF_HANDS_PROMPT

          cat << 'EOF_HANDS_OPERATOR' > "$HANDS_MAIN/HandsOperator.kt"
          package io.github.nanomuse.hands

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.os.Build
          import android.view.accessibility.AccessibilityNodeInfo
          import com.openminis.app.R
          import com.openminis.app.accessibility.MinisAccessibilityService
          import com.openminis.app.data.model.AgentContentPart
          import com.openminis.app.data.model.LLMMessage
          import com.openminis.app.data.model.ThinkingLevel
          import com.openminis.app.logging.AppLogger
          import com.openminis.app.provider.ProviderFactory
          import com.openminis.app.sandbox.PRootKernel
          import com.openminis.app.service.SessionActivityTracker
          import io.github.nanomuse.cloud.ClientEvents
          import io.github.nanomuse.cloud.Provenance
          import io.github.nanomuse.guard.GateOutcome
          import io.github.nanomuse.guard.GuardKind
          import io.github.nanomuse.guard.RiskAssessment
          import io.github.nanomuse.guard.RiskClass
          import io.github.nanomuse.guard.RiskDecision
          import io.github.nanomuse.guard.RiskGate
          import io.github.nanomuse.guard.RiskRequest
          import io.github.nanomuse.guard.TapWords
          import io.github.nanomuse.status.KeepAwake
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.withTimeout
          import kotlin.coroutines.EmptyCoroutineContext
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicReference

          /**
           * One task on the phone's screen, start to finish: screenshot → screen model → one action →
           * again, until the model says it is done, the user says stop, or the step budget runs out.
           *
           * Perception is the screenshot alone. The accessibility service performs the gestures and
           * takes the screenshot; the only node it ever touches is the field that has the cursor, to
           * type into it — and to refuse when that field is a password field.
           *
           * Runs on the sandbox worker thread that carries the `nanomuse-hands` call, so everything here
           * blocks; the capsule's buttons arrive from the main thread through flags and latches.
           */
          class HandsOperator(private val context: Context) {

              data class Options(
                  val task: String,
                  val appHint: String? = null,
                  /** A cap on steps for callers that want one; 0 (the default) means the run goes on until the task is done, the person stops it, or the time limit. */
                  val maxSteps: Int = DEFAULT_MAX_STEPS,
                  val sessionId: String? = null,
                  val agentName: String = "nanoMuse",
                  val language: String = "the user's language",
              )

              sealed class Outcome(val code: String) {
                  data class Done(val answer: String) : Outcome("done")
                  data class Infeasible(val message: String) : Outcome("infeasible")
                  data class Stopped(val message: String) : Outcome("stopped")
                  data class NeedsUser(val question: String) : Outcome("needs_user")
                  data class Failed(val message: String) : Outcome("failed")
              }

              data class Result(
                  val outcome: Outcome,
                  val steps: Int,
                  val runId: String,
                  /** `minis://attachments/hands/<run>/step-N.jpg` of the last screen, if any. */
                  val lastScreen: String?,
                  val tracePath: String?,
                  /** One line per step, for the tool result. */
                  val log: List<String>,
                  val model: String?,
              )

              private class Turn(val userText: String, val image: ByteArray?, var assistant: String)

              private val stop = AtomicBoolean(false)
              private val stopReason = AtomicReference<String?>(null)
              private val userSignal = AtomicReference<CountDownLatch?>(null)
              private val capsule = HandsCapsule(context)

              /** The session this run's approval cards are filed under; see [ownPendingRequest]. */
              @Volatile private var gateSession: String? = null
              /** The chat the run came from, for the record's events (null for a run without one). */
              @Volatile private var eventSession: String? = null

              /**
               * The approval card waiting on this run, if the one on top is ours: a tap or an Enter the
               * hands asked about, not a shell or browser request of some other conversation.
               */
              private fun ownPendingRequest(): RiskRequest? =
                  RiskGate.pending.value?.takeIf { it.kind == GuardKind.SCREEN && it.sessionId == gateSession }

              /**
               * Ends the run after the action in flight; from the capsule, the chat or the settings page.
               * A card the run is waiting on is answered with Deny, so Stop takes effect at once.
               */
              fun requestStop(reason: String = "the user tapped Stop") {
                  stopReason.compareAndSet(null, reason)
                  stop.set(true)
                  ownPendingRequest()?.let { RiskGate.decide(it.id, RiskDecision.DENY) }
                  userSignal.get()?.countDown()
              }

              fun run(opts: Options): Result {
                  val runId = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())
                  val log = mutableListOf<String>()
                  // where each model call sits, for the relay (relay 0.31): this run as the trajectory, the
                  // step being thought about, and the chat the task came from; one `hands.step` event per
                  // step and one at the end go to the account's record as codes (ClientEvents)
                  val where = Provenance.Hands(runId)
                  val calling = where + (opts.sessionId?.let { Provenance.Session(it) } ?: EmptyCoroutineContext)
                  eventSession = opts.sessionId
                  val traceDir = traceDir(opts.sessionId, runId)
                  var lastScreen: String? = null
                  var lastSentPrint: IntArray? = null
                  var lastInjectedTap: Pair<Int, Int>? = null
                  var steps = 0
                  val model = Hands.screenModel(context)
                  Hands.setActive(true)
                  Hands.current = this
                  gateSession = opts.sessionId ?: "hands"
                  SessionActivityTracker.setCameraSuppressActive(true) // one capsule at a time: ours, not OpenMinis'
                  capsule.onStop = { requestStop() }
                  capsule.onContinue = { userSignal.get()?.countDown() }
                  capsule.onOpenApp = { capsule.bringAppToFront(opts.sessionId) }
                  // the approval answered where the person is: the same request the chat card shows,
                  // and only ours (a shell or browser card of another conversation is not the capsule's to answer)
                  capsule.onAllow = { ownPendingRequest()?.let { RiskGate.decide(it.id, RiskDecision.ALLOW_ONCE) } }
                  capsule.onDeny = { ownPendingRequest()?.let { RiskGate.decide(it.id, RiskDecision.DENY) } }
                  val started = System.currentTimeMillis()
                  try {
                      val svc = MinisAccessibilityService.getInstance()
                          ?: return finish(Outcome.Failed("the accessibility service is not running"), steps, runId, lastScreen, traceDir, log, model?.label)
                      if (Build.VERSION.SDK_INT < Hands.MIN_SDK) {
                          return finish(Outcome.Failed("screenshots need Android 11"), steps, runId, lastScreen, traceDir, log, model?.label)
                      }
                      if (model == null) return finish(Outcome.Failed("no model that can see pictures is configured"), steps, runId, lastScreen, traceDir, log, null)
                      val provider = ProviderFactory.create(model.instance, model.apiKey, model.entry.model, context)
                      val apps = HandsApps.launchable(context)
                      val system = HandsPrompt.system(opts.task, apps.map { it.label }.take(MAX_APPS_IN_PROMPT), opts.agentName, opts.language)
                      val turns = mutableListOf<Turn>()
                      var lastResult: String? = null
                      var formatErrors = 0
                      var blackScreens = 0
                      var modelErrors = 0
                      // the same action on an unchanged screen: a note at the third, a stop at the sixth
                      val watch = HandsLoopWatch()
                      var loopNote: String? = null

                      // Sticky Session (`الجلسة اللاصقة` in hands-fast-vision.md):
                      // If the phone is already inside the target app (or a cloned game inside Clone Space),
                      // do NOT relaunch it and trigger the "Launching app, please wait…" overlay!
                      opts.appHint?.takeIf { it.isNotBlank() }?.let { hint ->
                          val app = HandsApps.resolve(context, hint)
                          val (fgPkg, _) = svc.foregroundPackage()
                          val alreadyInApp = app != null && fgPkg != null && (
                              fgPkg.equals(app.packageName, ignoreCase = true) ||
                                  fgPkg.contains("clone", ignoreCase = true) ||
                                  fgPkg.contains("dual", ignoreCase = true) ||
                                  fgPkg.contains("parallel", ignoreCase = true)
                              )
                          lastResult = if (alreadyInApp && app != null) {
                              "sticky session: already inside ${app.label} ($fgPkg); continuing from current screen without relaunching."
                          } else if (app != null && HandsApps.open(context, app)) {
                              Thread.sleep(OPEN_APP_SETTLE_MS); "opened ${app.label}."
                          } else "no installed app matches “$hint”; open the one you need yourself."
                          log += "open $hint → $lastResult"
                      }
                      Hands.lastResumeNote?.let { resumeInfo ->
                          lastResult = listOfNotNull(lastResult, "[Resumed from previous session state: $resumeInfo]").joinToString(" ")
                          Hands.lastResumeNote = null
                      }

                      while (opts.maxSteps <= 0 || steps < opts.maxSteps) {
                          if (stop.get()) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)
                          if (System.currentTimeMillis() - started > MAX_RUN_MS) {
                              return finish(Outcome.Stopped("the run hit its time limit"), steps, runId, lastScreen, traceDir, log, model.label)
                          }
                          steps++
                          KeepAwake.a11yTouched()
                          capsule.working(steps, context.getString(com.openminis.app.R.string.nm_hands_looking))

                          // ── look (with automatic wait for "Launching app, please wait…" overlays) ──
                          var rawShot = screenshot(svc) ?: return finish(Outcome.Failed("could not take a screenshot"), steps, runId, lastScreen, traceDir, log, model.label)
                          var screenW = rawShot.width
                          var screenH = rawShot.height
                          var scene = ScreenWords.analyzeScene(svc, rawShot, screenW, screenH)
                          var waitGuard = 0
                          while (scene.isLoadingOverlay && waitGuard < 4 && !stop.get()) {
                              rawShot.recycle()
                              Thread.sleep(650)
                              rawShot = screenshot(svc) ?: break
                              screenW = rawShot.width
                              screenH = rawShot.height
                              scene = ScreenWords.analyzeScene(svc, rawShot, screenW, screenH)
                              waitGuard++
                          }
                          val shot = rawShot
                          val jpeg = encode(shot, scene, lastInjectedTap, screenW, screenH)
                          lastScreen = save(traceDir, steps, jpeg, runId)
                          if (jpeg.black) {
                              shot.recycle()
                              blackScreens++
                              if (blackScreens > 2) return finish(Outcome.Infeasible("the screen stays protected (black screenshot); the app does not allow it to be read"), steps, runId, lastScreen, traceDir, log, model.label)
                              log += "step $steps: protected screen — handed to the user"
                              val cont = waitForUser(context.getString(com.openminis.app.R.string.nm_hands_protected_screen))
                              if (!cont) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)
                              lastResult = "the screen was protected (payment or banking); the user did that part and says to continue."
                              continue
                          }
                          blackScreens = 0

                          // ── think ──
                          val unchanged = unchangedSince(jpeg.print, lastSentPrint) && turns.isNotEmpty()
                          val stepText = buildString {
                              append(HandsPrompt.turnText(steps, lastResult))
                              if (unchanged) {
                                  append("\n[⚠️ WARNING: The screen did NOT change after your last action! Check the LAST_TAP marker on the screenshot and the Local Fast-Vision State below to adjust your coordinates.]")
                              }
                              if (scene.promptSummary.isNotEmpty()) {
                                  append("\n\n").append(scene.promptSummary)
                              }
                          }
                          val messages = buildMessages(turns, stepText, jpeg.bytes)
                          where.step = steps
                          val thinkingFrom = System.currentTimeMillis()
                          val reply = try {
                              runBlocking(calling) {
                                  withTimeout(MODEL_TIMEOUT_MS) {
                                      provider.sendMessage(messages, system, maxTokens = 1024, temperature = 0.0, thinkingLevel = ThinkingLevel.OFF).text
                                  }
                              }
                          } catch (t: Throwable) {
                              shot.recycle()
                              modelErrors++
                              AppLogger.warning(TAG, "model call failed: ${t.message}")
                              if (modelErrors >= 3) {
                                  val prevNote = lastResult ?: "in progress"
                                  Hands.lastResumeNote = "paused at step $steps ($prevNote)"
                                  return finish(Outcome.Failed("the screen model failed three times: ${t.message}"), steps, runId, lastScreen, traceDir, log, model.label)
                              }
                              steps--
                              Thread.sleep(1000)
                              continue
                          }
                          val thoughtMs = System.currentTimeMillis() - thinkingFrom
                          if (stop.get()) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)
                          val turn = Turn(stepText, jpeg.bytes, reply)
                          turns += turn
                          lastSentPrint = jpeg.print
                          val parsed = try {
                              HandsAction.parse(reply)
                          } catch (e: HandsAction.Companion.FormatError) {
                              shot.recycle()
                              formatErrors++
                              if (formatErrors >= 3) return finish(Outcome.Failed("the screen model did not answer in the action format (${e.message})"), steps, runId, lastScreen, traceDir, log, model.label)
                              lastResult = "your reply could not be read (${e.message}); answer with `Thought:` and one JSON `Action:` (a single object, or a short array of 2-4 objects when the next steps are obvious)."
                              log += "step $steps: unreadable reply"
                              trace(traceDir, steps, "", reply, lastResult, lastScreen)
                              step(runId, steps, "unreadable", "failed", thoughtMs)
                              continue
                          }
                          formatErrors = 0
                          val actions = parsed.actions
                          val batch = actions.size > 1
                          val settleTap = if (batch) BATCH_GAP_MS else TAP_SETTLE_MS
                          val settleSwipe = if (batch) BATCH_GAP_MS else SWIPE_SETTLE_MS
                          capsule.working(steps, parsed.thought.ifBlank { actions.first().describe() }.take(140))
                          log += "step $steps: " + (if (batch) "${actions.size}-action fast plan: " else "") + actions.joinToString("; ") { it.describe() } + (parsed.thought.takeIf { it.isNotBlank() }?.let { " — ${it.take(100)}" } ?: "")
                          val batchResults = mutableListOf<String>()
                          var activeShot: Bitmap = shot
                          var activeScene: ScreenWords.LocalSceneState = scene
                          try {
                          for ((batchIdx, action) in actions.withIndex()) {
                              if (batchIdx > 0) {
                                  val gap = if (action is HandsAction.Click) action.gapMs else BATCH_GAP_MS
                                  Thread.sleep(gap)
                              }

                              // ── the same thing again on the same screen? ──
                              when (watch.step(jpeg.print, action)) {
                                  HandsLoopWatch.Verdict.STOP -> {
                                      val why = HandsLoopWatch.stopReason(action)
                                      log += "step $steps: $why"
                                      trace(traceDir, steps, parsed.thought, reply, why, lastScreen)
                                      step(runId, steps, actionWord(action), "stopped", thoughtMs)
                                      return finish(Outcome.Infeasible(why), steps, runId, lastScreen, traceDir, log, model.label)
                                  }
                                  HandsLoopWatch.Verdict.NOTE -> {
                                      log += "step $steps: the same action on an unchanged screen, ${watch.streak} times running"
                                      loopNote = HandsLoopWatch.NOTE
                                  }
                                  HandsLoopWatch.Verdict.FINE -> loopNote = null
                              }

                              // ── act ──
                              when (action) {
                                  is HandsAction.Status -> {
                                      trace(traceDir, steps, parsed.thought, reply, "finished", lastScreen)
                                      return finish(
                                          if (action.complete) Outcome.Done(action.answer.ifBlank { parsed.thought }) else Outcome.Infeasible(action.answer.ifBlank { parsed.thought }),
                                          steps, runId, lastScreen, traceDir, log, model.label,
                                      )
                                  }
                                  is HandsAction.AskUser -> {
                                      trace(traceDir, steps, parsed.thought, reply, "asked the user", lastScreen)
                                      return finish(Outcome.NeedsUser(action.question.ifBlank { parsed.thought }), steps, runId, lastScreen, traceDir, log, model.label)
                                  }
                                  is HandsAction.TakeOver -> {
                                      val cont = waitForUser(action.reason.ifBlank { parsed.thought })
                                      step(runId, steps, "take_over", if (cont) "handed_over" else "stopped", thoughtMs)
                                      if (!cont) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)
                                      lastResult = "the user did it themselves and says to continue; look at the screen as it is now."
                                  }
                                  is HandsAction.Click, is HandsAction.DoubleTap, is HandsAction.LongPress -> {
                                      val resolved = ScreenWords.resolveWithContract(svc, activeShot, activeScene, action, screenW, screenH)
                                      var px = resolved.px
                                      var py = resolved.py
                                      val target = action.tapTarget.orEmpty()

                                      // Touch Contract Rule 3: Veto forbidden danger zones (Coin `+`, Shop tab, Settings)
                                      if (resolved.vetoReason != null) {
                                          lastResult = "${resolved.vetoReason}. Do NOT tap the top Coin bar or Shop tab; aim at the green Level button [500, 768] or playable board pieces."
                                          log += "step $steps: $lastResult"
                                          batchResults += lastResult!!
                                          break
                                      }

                                      val gate = approveTap(svc, opts.sessionId, target, ScreenWords.at(svc, px, py))
                                      if (gate.denied != null) {
                                          trace(traceDir, steps, parsed.thought, reply, "refused: ${gate.denied}", lastScreen)
                                          step(runId, steps, actionWord(action), "refused", thoughtMs)
                                          return finish(Outcome.Infeasible("the user did not allow the tap “${gate.shown.take(40)}” — ${gate.denied}"), steps, runId, lastScreen, traceDir, log, model.label)
                                      }
                                      gate.notice?.let { log += it }
                                      if (stop.get()) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)

                                      val patchBefore = sampleLocalPatch(activeShot, px, py, screenW, screenH)
                                      capsule.dodge(px, py)
                                      capsule.stage.aim(px, py, fxLabel(action))
                                      Thread.sleep(AIM_MS)
                                      var ok = capsule.passThrough {
                                          when (action) {
                                              is HandsAction.LongPress -> { capsule.stage.hold(LONG_PRESS_MS); tap(svc, px, py, LONG_PRESS_MS) }
                                              is HandsAction.DoubleTap -> tap(svc, px, py, 45).also { capsule.stage.ripple(px, py); Thread.sleep(75) } && tap(svc, px, py, 45)
                                              else -> tap(svc, px, py, 55)
                                          }
                                      }
                                      capsule.stage.ripple(px, py)
                                      lastInjectedTap = px to py

                                      val retriedNote = ""
                                      if (!batch || batchIdx == actions.size - 1) {
                                          Thread.sleep(settleTap)
                                      }

                                      // Touch Contract Rule 4: Record requested, injected, and under-finger info
                                      lastResult = if (ok) {
                                          "${action.describe()} [req=${resolved.resolvedFrom} -> injected=($px,$py), under=${resolved.underFingerDesc}]$retriedNote"
                                      } else {
                                          "the gesture at ($px, $py) was rejected by the system; try again or another way."
                                      }
                                  }
                                  is HandsAction.Swipe -> {
                                      val (x1, y1) = action.from.toPixels(screenW, screenH)
                                      val (x2, y2) = action.to.toPixels(screenW, screenH)
                                      val ok = sweep(svc, x1, y1, x2, y2, SWIPE_MS, fxLabel(action))
                                      lastResult = if (ok) "swiped from ($x1, $y1) to ($x2, $y2)." else "the swipe was rejected by the system."
                                      Thread.sleep(settleSwipe)
                                  }
                                  is HandsAction.Scroll -> {
                                      val cx = screenW / 2
                                      val cy = screenH / 2
                                      val dx = screenW * 35 / 100
                                      val dy = screenH * 30 / 100
                                      val (from, to) = when (action.direction) {
                                          "down" -> (cx to cy + dy / 2 + dy / 4) to (cx to cy - dy / 2 - dy / 4)
                                          "up" -> (cx to cy - dy / 2 - dy / 4) to (cx to cy + dy / 2 + dy / 4)
                                          "left" -> (cx + dx to cy) to (cx - dx to cy)
                                          else -> (cx - dx to cy) to (cx + dx to cy)
                                      }
                                      val ok = sweep(svc, from.first, from.second, to.first, to.second, SCROLL_MS, fxLabel(action))
                                      lastResult = if (ok) "scrolled ${action.direction}." else "the scroll was rejected by the system."
                                      Thread.sleep(settleSwipe)
                                  }
                                  is HandsAction.InputText -> {
                                      if (!TapWords.looksSecret(action.field)) capsule.stage.say(fxLabel(action))
                                      lastResult = typeText(svc, action)
                                      if (lastResult == HANDOFF) {
                                          val cont = waitForUser(context.getString(com.openminis.app.R.string.nm_hands_secret_field))
                                          if (!cont) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)
                                          lastResult = "that field is a password or code field, which you never type; the user filled it in and says to continue."
                                      }
                                      Thread.sleep(settleTap)
                                  }
                                  HandsAction.KeyboardEnter -> {
                                      // Enter in a messenger's field *is* the send button: the same card a tap on “Send” gets.
                                      val gate = approveEnter(svc, opts.sessionId)
                                      if (gate.denied != null) {
                                          trace(traceDir, steps, parsed.thought, reply, "refused: ${gate.denied}", lastScreen)
                                          step(runId, steps, "enter", "refused", thoughtMs)
                                          return finish(Outcome.Infeasible("the user did not allow sending with Enter — ${gate.denied}"), steps, runId, lastScreen, traceDir, log, model.label)
                                      }
                                      gate.notice?.let { log += it }
                                      if (stop.get()) return finish(Outcome.Stopped(stopReason.get() ?: "stopped"), steps, runId, lastScreen, traceDir, log, model.label)
                                      capsule.stage.say(fxLabel(action))
                                      lastResult = pressEnter(svc)
                                      Thread.sleep(settleTap)
                                  }
                                  is HandsAction.OpenApp -> {
                                      val app = HandsApps.resolve(context, action.appName)
                                      val (fgPkg, _) = svc.foregroundPackage()
                                      val alreadyThere = app != null && fgPkg != null && fgPkg.equals(app.packageName, ignoreCase = true)
                                      lastResult = if (alreadyThere && app != null) {
                                          "already in ${app.label} — stayed on current screen."
                                      } else if (app != null && HandsApps.open(context, app)) {
                                          capsule.stage.say(context.getString(com.openminis.app.R.string.nm_hands_fx_open, app.label))
                                          Thread.sleep(OPEN_APP_SETTLE_MS); "opened ${app.label}."
                                      } else {
                                          "no installed app matches “${action.appName}”. Installed: " + apps.take(40).joinToString(", ") { it.label } + ". Open it from the home screen if you must."
                                      }
                                  }
                                  HandsAction.Back -> {
                                      capsule.stage.say(fxLabel(action))
                                      svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK)
                                      lastResult = "pressed Back."
                                      Thread.sleep(settleTap)
                                  }
                                  HandsAction.Home -> {
                                      capsule.stage.say(fxLabel(action))
                                      svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME)
                                      lastResult = "went to the home screen."
                                      Thread.sleep(settleTap)
                                  }
                                  is HandsAction.Wait -> {
                                      capsule.stage.say(fxLabel(action))
                                      Thread.sleep(action.seconds * 1000L)
                                      lastResult = "waited ${action.seconds}s."
                                  }
                              }
                              loopNote?.let { note -> lastResult = listOfNotNull(lastResult, note).joinToString(" ") }
                              if (batch) {
                                  val curRes = lastResult.orEmpty()
                                  val itemSummary = "(${batchIdx + 1}/${actions.size}) $curRes"
                                  batchResults += itemSummary
                                  lastResult = batchResults.joinToString("; ")
                              }
                              trace(traceDir, steps, parsed.thought, reply, lastResult ?: "", lastScreen)
                              if (action !is HandsAction.TakeOver) step(runId, steps, actionWord(action), if (lastResult?.contains("rejected by the system") == true) "failed" else "ok", thoughtMs)
                          }
                          } finally {
                              if (activeShot !== shot) runCatching { activeShot.recycle() }
                              runCatching { shot.recycle() }
                          }
                      }
                      val finalNote = lastResult ?: "in progress"
                      Hands.lastResumeNote = "step limit (${opts.maxSteps}) reached; last state: $finalNote"
                      return finish(Outcome.Infeasible("the step limit (${opts.maxSteps}) was reached before the task was done"), steps, runId, lastScreen, traceDir, log, model.label, end = "max_steps")
                  } catch (t: Throwable) {
                      AppLogger.warning(TAG, "run failed: ${t.javaClass.simpleName} ${t.message}")
                      return finish(Outcome.Failed("${t.javaClass.simpleName}: ${t.message}"), steps, runId, lastScreen, traceDir, log, model?.label)
                  } finally {
                      capsule.hide()
                      Hands.current = null
                      Hands.setActive(false)
                      SessionActivityTracker.setCameraSuppressActive(false)
                      capsule.bringAppToFront(opts.sessionId)
                  }
              }

              private fun finish(outcome: Outcome, steps: Int, runId: String, lastScreen: String?, traceDir: File?, log: List<String>, model: String?, end: String? = null): Result {
                  // the run's end for the record: `done`, `ask`, `blocked`, `stopped`, `failed`, `max_steps` (docs/cloud.md "Client events")
                  val word = end ?: when (outcome) {
                      is Outcome.Done -> "done"
                      is Outcome.NeedsUser -> "ask"
                      is Outcome.Infeasible -> "blocked"
                      is Outcome.Stopped -> "stopped"
                      is Outcome.Failed -> "failed"
                  }
                  step(runId, steps, "end", word, null)
                  return Result(outcome, steps, runId, lastScreen, traceDir?.let { "/var/minis/attachments/hands/$runId/trace.jsonl" }, log, model)
              }

              /** One `hands.step` to the record: the trajectory, the step, the action's kind and how it went; never the screen or the words. */
              private fun step(runId: String, step: Int, action: String, outcome: String?, latencyMs: Long?) {
                  runCatching { ClientEvents.handsStep(eventSession, runId, step, action, outcome, latencyMs) }
              }

              /** The action's kind, as the record names it. */
              private fun actionWord(a: HandsAction): String = when (a) {
                  is HandsAction.Click -> "tap"
                  is HandsAction.DoubleTap -> "double_tap"
                  is HandsAction.LongPress -> "long_press"
                  is HandsAction.Swipe -> "swipe"
                  is HandsAction.Scroll -> "scroll"
                  is HandsAction.InputText -> "type"
                  HandsAction.KeyboardEnter -> "enter"
                  is HandsAction.OpenApp -> "open_app"
                  HandsAction.Back -> "back"
                  HandsAction.Home -> "home"
                  is HandsAction.Wait -> "wait"
                  is HandsAction.TakeOver -> "take_over"
                  is HandsAction.AskUser -> "ask"
                  is HandsAction.Status -> "status"
              }

              // ── the user's turn ────────────────────────────────────────────────────

              /** Shows the take-over card and waits for Continue; false when Stop was tapped or nobody came. */
              private fun waitForUser(reason: String): Boolean {
                  val latch = CountDownLatch(1)
                  userSignal.set(latch)
                  capsule.takeOver(reason)
                  val came = latch.await(TAKE_OVER_TIMEOUT_MS, TimeUnit.MILLISECONDS)
                  userSignal.set(null)
                  if (!came) requestStop("nobody continued within ${TAKE_OVER_TIMEOUT_MS / 60_000} minutes")
                  if (stop.get()) return false
                  capsule.working(0, context.getString(com.openminis.app.R.string.nm_hands_looking))
                  Thread.sleep(600)
                  return true
              }

              /** Null [denied] when the tap may go ahead; [notice] is what the chat model should pass on. */
              private data class TapGate(val denied: String? = null, val notice: String? = null, val shown: String = "")

              /**
               * The approval for a tap whose label says pay, send, post or delete. The person is in the
               * operated app, so the capsule takes the answer itself (Allow once / Deny); the card in the
               * chat and the notification show the same request. Money needs the screen lock, which only
               * the card can ask for: the capsule then offers Open.
               */
              private fun approveTap(svc: MinisAccessibilityService, sessionId: String?, target: String, onScreen: String?): TapGate {
                  val shown = TapWords.shown(target, onScreen)
                  val cls = TapWords.classify(target, onScreen) ?: return TapGate(shown = shown)
                  val (pkg, _) = svc.foregroundPackage()
                  val appLabel = HandsApps.labelOf(context, pkg)
                  val short = shown.take(40)
                  val assessment = RiskAssessment(cls, TapWords.reason(cls, short, appLabel), appLabel?.let { "app:$it" })
                  val decidable = cls != RiskClass.MONEY
                  capsule.approval(context.getString(if (decidable) com.openminis.app.R.string.nm_hands_approval_here else com.openminis.app.R.string.nm_hands_approval_detail, short), decidable)
                  val outcome = runBlocking {
                      RiskGate.check(sessionId ?: "hands", GuardKind.SCREEN, assessment, preview = "Tap “$short”", pageUrl = appLabel, elementText = short)
                  }
                  // The user may have opened nanoMuse to answer; put the operated app back in front.
                  val (nowPkg, _) = svc.foregroundPackage()
                  if (nowPkg == context.packageName && pkg != null && pkg != context.packageName) {
                      HandsApps.launchable(context).firstOrNull { it.packageName == pkg }?.let { HandsApps.open(context, it) }
                      Thread.sleep(OPEN_APP_SETTLE_MS)
                  }
                  capsule.working(0, context.getString(com.openminis.app.R.string.nm_hands_looking))
                  return when (outcome) {
                      is GateOutcome.Allowed -> TapGate(notice = outcome.notice, shown = shown)
                      is GateOutcome.Denied -> TapGate(denied = outcome.message, shown = shown)
                  }
              }

              /**
               * Enter with the cursor in a message field sends the message (0.1.31): in a messenger, or
               * when the field's hint says so, it takes the outbound card a tap on “Send” would. Enter in
               * a search box, a form or a terminal is an ordinary key.
               */
              private fun approveEnter(svc: MinisAccessibilityService, sessionId: String?): TapGate {
                  val node = focusedField(svc) ?: return TapGate()
                  val hint = listOfNotNull(node.hintText?.toString(), node.contentDescription?.toString()).joinToString(" ")
                  val (pkg, _) = svc.foregroundPackage()
                  if (!TapWords.entersSend(pkg, hint)) return TapGate()
                  val appLabel = HandsApps.labelOf(context, pkg)
                  val where = appLabel ?: context.getString(com.openminis.app.R.string.nm_hands_this_phone)
                  val assessment = RiskAssessment(RiskClass.OUTBOUND, "presses Enter in a message field, which sends it ($where)", appLabel?.let { "app:$it" })
                  capsule.approval(context.getString(com.openminis.app.R.string.nm_hands_approval_here, context.getString(com.openminis.app.R.string.nm_hands_fx_enter)), decidable = true)
                  val outcome = runBlocking {
                      RiskGate.check(sessionId ?: "hands", GuardKind.SCREEN, assessment, preview = "Enter → send", pageUrl = appLabel, elementText = context.getString(com.openminis.app.R.string.nm_hands_fx_enter))
                  }
                  val (nowPkg, _) = svc.foregroundPackage()
                  if (nowPkg == context.packageName && pkg != null && pkg != context.packageName) {
                      HandsApps.launchable(context).firstOrNull { it.packageName == pkg }?.let { HandsApps.open(context, it) }
                      Thread.sleep(OPEN_APP_SETTLE_MS)
                  }
                  capsule.working(0, context.getString(com.openminis.app.R.string.nm_hands_looking))
                  return when (outcome) {
                      is GateOutcome.Allowed -> TapGate(notice = outcome.notice, shown = "Enter")
                      is GateOutcome.Denied -> TapGate(denied = outcome.message, shown = "Enter")
                  }
              }

              // ── the hand ───────────────────────────────────────────────────────────

              private fun tap(svc: MinisAccessibilityService, x: Int, y: Int, durationMs: Long): Boolean {
                  val path = Path().apply { moveTo(x.toFloat(), y.toFloat()); lineTo(x + 0.5f, y + 0.5f) }
                  return svc.dispatchSimpleGesture(path, 0L, durationMs)
              }

              private fun swipe(svc: MinisAccessibilityService, x1: Int, y1: Int, x2: Int, y2: Int, durationMs: Long): Boolean {
                  val path = Path().apply { moveTo(x1.toFloat(), y1.toFloat()); lineTo(x2.toFloat(), y2.toFloat()) }
                  return svc.dispatchSimpleGesture(path, 0L, durationMs)
              }

              /** A swipe with its picture: the ring waits [AIM_MS] at the start, then travels with the finger. */
              private fun sweep(svc: MinisAccessibilityService, x1: Int, y1: Int, x2: Int, y2: Int, durationMs: Long, label: String): Boolean {
                  capsule.dodge(x1, y1)
                  capsule.stage.sweep(x1, y1, x2, y2, AIM_MS, durationMs, label)
                  Thread.sleep(AIM_MS)
                  return capsule.passThrough { swipe(svc, x1, y1, x2, y2, durationMs) }
              }

              /** The action's name for the ring's label, in the user's language. */
              private fun fxLabel(action: HandsAction): String {
                  fun target(plain: Int, withTarget: Int, t: String) =
                      if (t.isBlank()) context.getString(plain) else context.getString(withTarget, t.take(24))
                  return when (action) {
                      is HandsAction.Click -> target(R.string.nm_hands_fx_tap, R.string.nm_hands_fx_tap_target, action.target)
                      is HandsAction.DoubleTap -> target(R.string.nm_hands_fx_double_tap, R.string.nm_hands_fx_double_tap_target, action.target)
                      is HandsAction.LongPress -> target(R.string.nm_hands_fx_hold, R.string.nm_hands_fx_hold_target, action.target)
                      is HandsAction.Swipe -> context.getString(R.string.nm_hands_fx_swipe)
                      is HandsAction.Scroll -> context.getString(
                          when (action.direction) {
                              "up" -> R.string.nm_hands_fx_scroll_up
                              "left" -> R.string.nm_hands_fx_scroll_left
                              "right" -> R.string.nm_hands_fx_scroll_right
                              else -> R.string.nm_hands_fx_scroll_down
                          },
                      )
                      is HandsAction.InputText -> context.getString(R.string.nm_hands_fx_type, action.text.take(24))
                      HandsAction.KeyboardEnter -> context.getString(R.string.nm_hands_fx_enter)
                      HandsAction.Back -> context.getString(R.string.nm_hands_fx_back)
                      HandsAction.Home -> context.getString(R.string.nm_hands_fx_home)
                      is HandsAction.OpenApp -> context.getString(R.string.nm_hands_fx_open, action.appName)
                      is HandsAction.Wait -> context.getString(R.string.nm_hands_fx_wait, action.seconds)
                      else -> ""
                  }
              }

              private fun focusedField(svc: MinisAccessibilityService): AccessibilityNodeInfo? =
                  svc.rootNodes().firstNotNullOfOrNull { root -> runCatching { root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) }.getOrNull() }

              /** Types into the field with the cursor; [HANDOFF] when that field is a secret. */
              private fun typeText(svc: MinisAccessibilityService, action: HandsAction.InputText): String {
                  if (TapWords.looksSecret(action.field)) return HANDOFF
                  val node = focusedField(svc) ?: return "no text field has the cursor; tap the field first, then type in the next turn."
                  if (node.isPassword) return HANDOFF
                  val hint = listOfNotNull(node.hintText?.toString(), node.contentDescription?.toString()).joinToString(" ")
                  if (hint.isNotBlank() && TapWords.looksSecret(hint)) return HANDOFF
                  val ok = svc.setNodeText(node, action.text)
                  return if (ok) "typed “${action.text.take(60)}” into the field." else "the field did not accept text (ACTION_SET_TEXT failed); tap it and try again."
              }

              private fun pressEnter(svc: MinisAccessibilityService): String {
                  val node = focusedField(svc) ?: return "no text field has the cursor, so there is nothing to submit; tap the search or send button instead."
                  val ok = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                  } else false
                  return if (ok) "pressed Enter." else "Enter is not available for this field; tap the search or send button on the screen instead."
              }

              // ── the eyes ───────────────────────────────────────────────────────────

              private fun screenshot(svc: MinisAccessibilityService): Bitmap? {
                  capsule.hideForCapture()
                  try {
                      repeat(2) { attempt ->
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              val shot = svc.captureScreenshot(timeoutMs = 6_000)
                              shot.bitmap?.let { return it }
                              AppLogger.warning(TAG, "screenshot failed (${shot.errorCode}): ${shot.errorMessage}")
                          }
                          if (attempt == 0) Thread.sleep(400)
                      }
                      return null
                  } finally {
                      capsule.restore()
                  }
              }

              /** [print]: the grey level of each sampled cell, the fingerprint [HandsLoopWatch] compares. */
              private class Jpeg(val bytes: ByteArray, val black: Boolean, val print: IntArray)

              /** Down to [SHOT_MAX_SIDE] px on the LONGEST side and JPEG — the
               * PalmClaw field-proven capture recipe: on a 1080×2400 phone this is
               * a 360×800 frame (~0.29 Mpx), the size PalmClaw shipped for the
               * same device, roughly a quarter of the image tokens the previous
               * 720-wide policy billed per step. The grid is relative, so nothing
               * is lost for tapping. */
              /** Fast screenshot without capsule toggle sleep, for mid-batch local motion tracking. */
              private fun screenshotFast(svc: MinisAccessibilityService): Bitmap? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  return svc.captureScreenshot(timeoutMs = 2_500).bitmap
              }

              /** Samples a 5x5 grid of grey levels around (px, py) to detect if a tapped game piece moved. */
              private fun sampleLocalPatch(bmp: Bitmap, px: Int, py: Int, screenW: Int, screenH: Int): IntArray {
                  if (screenW <= 0 || screenH <= 0) return IntArray(0)
                  val cx = (px.toLong() * bmp.width / screenW).toInt().coerceIn(0, bmp.width - 1)
                  val cy = (py.toLong() * bmp.height / screenH).toInt().coerceIn(0, bmp.height - 1)
                  val radius = (bmp.width / 28).coerceAtLeast(6)
                  val out = IntArray(25)
                  var idx = 0
                  for (dy in -2..2) {
                      val y = (cy + dy * radius / 2).coerceIn(0, bmp.height - 1)
                      for (dx in -2..2) {
                          val x = (cx + dx * radius / 2).coerceIn(0, bmp.width - 1)
                          val c = bmp.getPixel(x, y)
                          out[idx++] = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000
                      }
                  }
                  return out
              }

              private fun patchMoved(before: IntArray, after: IntArray): Boolean {
                  if (before.size != after.size || before.isEmpty()) return true
                  var diffCells = 0
                  for (i in before.indices) {
                      if (kotlin.math.abs(before[i] - after[i]) > 22) diffCells++
                  }
                  return diffCells >= 4
              }

              private fun encode(
                  shot: Bitmap,
                  scene: ScreenWords.LocalSceneState,
                  lastTap: Pair<Int, Int>?,
                  screenW: Int,
                  screenH: Int,
              ): Jpeg {
                  val longest = maxOf(shot.width, shot.height)
                  val scale = if (longest > SHOT_MAX_SIDE) SHOT_MAX_SIDE.toFloat() / longest else 1f
                  val baseScaled = if (scale < 1f)
                      Bitmap.createScaledBitmap(shot, (shot.width * scale).toInt().coerceAtLeast(1), (shot.height * scale).toInt().coerceAtLeast(1), true)
                  else shot
                  val print = sample(baseScaled)
                  val black = looksBlack(print)
                  val annotated = baseScaled.copy(Bitmap.Config.ARGB_8888, true)
                  if (baseScaled !== shot) baseScaled.recycle()
                  if (!black) {
                      drawFastVisionOverlay(annotated, scene, lastTap, screenW, screenH)
                  }
                  val out = ByteArrayOutputStream()
                  annotated.compress(Bitmap.CompressFormat.JPEG, JPEG_QUALITY, out)
                  annotated.recycle()
                  return Jpeg(out.toByteArray(), black, print)
              }

              /**
               * Draws:
               * 1. Calibrated 0–999 yellow coordinate grid (`x,y`).
               * 2. Tracked object ID badges (`green_btn`, `c1..cN`) from the local fast eye.
               * 3. The `LAST_TAP` bullseye crosshair (Contract Rule 5) so the model sees where its
               *    previous tap actually landed.
               */
              private fun drawFastVisionOverlay(
                  bmp: Bitmap,
                  scene: ScreenWords.LocalSceneState,
                  lastTap: Pair<Int, Int>?,
                  screenW: Int,
                  screenH: Int,
              ) {
                  val w = bmp.width.toFloat()
                  val h = bmp.height.toFloat()
                  if (w < 100f || h < 100f) return
                  val canvas = Canvas(bmp)
                  val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(105, 255, 235, 59)
                      strokeWidth = 1.1f
                      style = Paint.Style.STROKE
                  }
                  val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(170, 15, 15, 15)
                      style = Paint.Style.FILL
                  }
                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(240, 255, 241, 118)
                      textSize = (w * 0.021f).coerceIn(10f, 14f)
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  }
                  val gxSteps = intArrayOf(125, 250, 375, 500, 625, 750, 875)
                  val gySteps = intArrayOf(100, 200, 300, 400, 500, 600, 700, 800, 900)
                  for (gx in gxSteps) {
                      val px = gx * w / 1000f
                      canvas.drawLine(px, 0f, px, h, linePaint)
                  }
                  for (gy in gySteps) {
                      val py = gy * h / 1000f
                      canvas.drawLine(0f, py, w, py, linePaint)
                  }
                  val fm = textPaint.fontMetrics
                  val textH = fm.descent - fm.ascent
                  for (gy in gySteps) {
                      val py = gy * h / 1000f
                      for (gx in gxSteps) {
                          val px = gx * w / 1000f
                          val label = "$gx,$gy"
                          val textW = textPaint.measureText(label)
                          val rect = RectF(
                              px - textW / 2f - 2.5f,
                              py - textH / 2f - 1f,
                              px + textW / 2f + 2.5f,
                              py + textH / 2f + 1f,
                          )
                          canvas.drawRoundRect(rect, 3f, 3f, bgPaint)
                          canvas.drawText(label, px - textW / 2f, py - (fm.ascent + fm.descent) / 2f, textPaint)
                      }
                  }

                  // Draw tracked visual object IDs (green_btn and candidate pieces with eyes)
                  val idBgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(210, 0, 77, 64)
                      style = Paint.Style.FILL
                  }
                  val idTextPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = (w * 0.023f).coerceIn(11f, 15f)
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  }
                  for (obj in scene.objects) {
                      if (obj.id == "green_btn" || (obj.id.startsWith("c") && obj.freeOrEyes)) {
                          val ox = obj.gx * w / 1000f
                          val oy = obj.gy * h / 1000f
                          val tag = "${obj.id}[${obj.gx},${obj.gy}]"
                          val tw = idTextPaint.measureText(tag)
                          val rect = RectF(ox - tw / 2f - 4f, oy - textH / 2f - 2f, ox + tw / 2f + 4f, oy + textH / 2f + 2f)
                          canvas.drawRoundRect(rect, 4f, 4f, idBgPaint)
                          canvas.drawText(tag, ox - tw / 2f, oy - (fm.ascent + fm.descent) / 2f, idTextPaint)
                      }
                  }

                  // Touch Contract Rule 5: Draw the previous injected tap marker on the next frame
                  if (lastTap != null && screenW > 0 && screenH > 0) {
                      val tx = lastTap.first * w / screenW
                      val ty = lastTap.second * h / screenH
                      val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.argb(235, 0, 229, 255)
                          strokeWidth = 3f
                          style = Paint.Style.STROKE
                      }
                      val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.argb(235, 255, 23, 68)
                          style = Paint.Style.FILL
                      }
                      canvas.drawCircle(tx, ty, 14f, ringPaint)
                      canvas.drawCircle(tx, ty, 4.5f, dotPaint)
                  }
              }

              /** True when [print] is cell-for-cell near [last]: the screen
               * did not visibly change, so the model would be billed the same image
               * twice (PalmClaw's live-vision dedup rule: unchanged frames are not
               * re-sent). */
              private fun unchangedSince(print: IntArray, last: IntArray?): Boolean {
                  if (last == null || last.size != print.size || print.isEmpty()) return false
                  val near = print.indices.count { kotlin.math.abs(print[it] - last[it]) <= 4 }
                  return near * 100 / print.size >= 99
              }

              /** A grid of 12 × 20 pixels, each as a grey level 0–255: enough to tell a black frame and an unchanged screen. */
              private fun sample(b: Bitmap): IntArray {
                  val out = ArrayList<Int>(240)
                  val stepX = (b.width / 12).coerceAtLeast(1)
                  val stepY = (b.height / 20).coerceAtLeast(1)
                  var y = stepY / 2
                  while (y < b.height) {
                      var x = stepX / 2
                      while (x < b.width) {
                          val c = b.getPixel(x, y)
                          out += (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000
                          x += stepX
                      }
                      y += stepY
                  }
                  return out.toIntArray()
              }

              /** A FLAG_SECURE page comes back as a black frame: nearly every sampled cell is dark. */
              private fun looksBlack(print: IntArray): Boolean {
                  if (print.isEmpty()) return false
                  val dark = print.count { it < 12 }
                  return dark * 100 / print.size >= 98
              }

              private fun buildMessages(turns: List<Turn>, currentText: String, current: ByteArray?): List<LLMMessage> {
                  val out = mutableListOf<LLMMessage>()
                  val withImage = turns.size - HISTORY_IMAGES
                  turns.forEachIndexed { i, t ->
                      val parts = mutableListOf<AgentContentPart>(AgentContentPart.Text(t.userText))
                      if (i >= withImage && t.image != null) parts += AgentContentPart.ImageData(t.image, "image/jpeg")
                      else parts += AgentContentPart.Text(HandsPrompt.OLDER_SCREEN)
                      out += LLMMessage(LLMMessage.Role.USER, content = t.userText, contentParts = parts)
                      out += LLMMessage(LLMMessage.Role.ASSISTANT, content = t.assistant)
                  }
                  out += LLMMessage(
                      LLMMessage.Role.USER,
                      content = currentText,
                      contentParts = if (current != null)
                          listOf(AgentContentPart.Text(currentText), AgentContentPart.ImageData(current, "image/jpeg"))
                      else
                          listOf(AgentContentPart.Text(currentText)),
                  )
                  return out
              }

              // ── the trace ──────────────────────────────────────────────────────────

              private fun traceDir(sessionId: String?, runId: String): File? {
                  val base = if (sessionId != null) File(context.filesDir, "minis-sessions/$sessionId/attachments")
                  else PRootKernel.resolveHostPath("/var/minis/attachments")
                  val hands = base?.let { File(it, "hands") } ?: return null
                  // the person's screen is not kept without bound: older runs keep their trace and last screen
                  runCatching { HandsTraces.prune(hands) }
                  return File(hands, runId).apply { mkdirs() }
              }

              private fun save(dir: File?, step: Int, jpeg: Jpeg, runId: String): String? {
                  dir ?: return null
                  return runCatching {
                      File(dir, "step-$step.jpg").writeBytes(jpeg.bytes)
                      "minis://attachments/hands/$runId/step-$step.jpg"
                  }.getOrNull()
              }

              private fun trace(dir: File?, step: Int, thought: String, reply: String, result: String, screen: String?) {
                  dir ?: return
                  runCatching {
                      val line = JSONObject()
                          .put("step", step).put("at", System.currentTimeMillis())
                          .put("thought", thought).put("reply", reply).put("result", result).put("screen", screen ?: JSONObject.NULL)
                      File(dir, "trace.jsonl").appendText(line.toString() + "\n")
                  }
              }

              companion object {
                  private const val TAG = "Hands"
                  /** No step cap: a task takes as many steps as it takes (the time limit and the Stop button remain). */
                  const val DEFAULT_MAX_STEPS = 0
                  private const val MAX_APPS_IN_PROMPT = 120
                  /** Longest side of a sent frame — PalmClaw's field-proven budget. */
                  private const val SHOT_MAX_SIDE = 1200
                  private const val JPEG_QUALITY = 85
                  private const val HISTORY_IMAGES = 1
                  private const val MODEL_TIMEOUT_MS = 90_000L
                  private const val TAKE_OVER_TIMEOUT_MS = 5 * 60_000L
                  private const val MAX_RUN_MS = 30 * 60_000L
                  private const val TAP_SETTLE_MS = 180L
                  private const val SWIPE_SETTLE_MS = 650L
                  private const val OPEN_APP_SETTLE_MS = 1000L
                  /** Breathing room between the actions of one batch (fast, human-paced). */
                  private const val BATCH_GAP_MS = 150L
                  /** The ring shows this long before the finger lands, so the eye gets there first. */
                  private const val AIM_MS = 35L
                  private const val LONG_PRESS_MS = 900L
                  private const val SWIPE_MS = 350L
                  private const val SCROLL_MS = 400L
                  private const val HANDOFF = "\u0000handoff"
              }
          }
