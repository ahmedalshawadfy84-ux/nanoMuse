                  val p = HandsAction.parse("Action: {\"action_type\":\"click\",\"coordinate\":[500,500],\"target\":\"x\"}")
                  assertEquals(1, p.actions.size)
                  assertEquals(HandsAction.Click(HandsAction.Point(500, 500), "x"), p.action)
              }

              @Test fun `regression test from hands-fast-vision - green button 500 768 never hits coin bar 551 208`() {
                  val greenBtnPoint = HandsAction.Point(500, 768).toPixels(1080, 2400)
                  assertEquals(540 to 1843, greenBtnPoint)
                  // Coin bar at (551, 208) is vetoed when targeting Level 5 / Level 6 / Continue
                  val coinVeto = ScreenWords.checkDangerZone(551, 208, "Level 6", "", 1080, 2400, isGameCanvas = true)
                  assertTrue(coinVeto != null && coinVeto.contains("FORBIDDEN_DANGER_ZONE"))
                  // Green button at (540, 1843) is allowed
                  val greenAllowed = ScreenWords.checkDangerZone(540, 1843, "Level 6", "green_btn", 1080, 2400, isGameCanvas = true)
                  assertNull(greenAllowed)
              }
          }
